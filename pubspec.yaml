name: carecar_mobile
description: "CareCar mobile application"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_svg: ^2.3.0
  pdfx: 2.11.0
  flutter_file_dialog: ^3.0.2
  shared_preferences: ^2.5.6

  # Almacenamiento seguro de los dos tokens de sesion (TEC-6 T3, decision D-D).
  #
  # Autorizada por Jael el 27 de octubre de 2026. Hace falta porque la v1.1 del
  # contrato trajo un refresh token de 30 dias: guardarlo en memoria obligaria
  # al cliente a escribir su contrasena cada vez que abre la app, que es
  # justamente lo que el refresh viene a evitar.
  #
  # Usa el Keystore de Android y el Keychain de iOS. Queda detras de la interfaz
  # `AlmacenSesion`, asi que si el equipo prefiere otra, se cambia una clase.
  flutter_secure_storage: ^11.2.0
  flutter_animate: ^4.5.2

  # Animaciones y esqueletos de carga de las pantallas de citas (APP-3.3).
  skeletonizer: ^3.0.0
  shadcn_ui: ^0.61.2
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2

  # Estado e inyeccion de dependencias de la v2 (ADR 0002, V2-T01.02).
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  quick_actions: ^1.1.1
  share_plus: ^13.3.1
  home_widget: ^0.10.0
  safe_device: ^1.4.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.1
  geocoding: ^5.0.1
  image_picker: ^1.2.4
  http_parser: ^4.1.2

  # Bitacora del conductor (V2-M18): lectura del ticket en el dispositivo
  # (ML Kit, la foto no sale del telefono), toma de la foto y PDF de la
  # exportacion.
  google_mlkit_text_recognition: ^1.0.3
  pdf: ^3.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  yaml: ^3.1.4
  # Huellas SHA-256 de los certificados fijados (V2-M22.04); ya estaba como
  # dependencia transitiva de http y de flutter_secure_storage.
  crypto: ^3.0.0
  flutter_launcher_icons: ^0.9.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Genera `AppLocalizations` a partir de los ARB de lib/l10n (V2-M20.01).
  generate: true

  # Marca de Agencia360 (APP-UX-1).
  #
  # Los archivos llegaron como JPEG, no como los SVG que pide la guia de
  # estilos (peticion EQ-3). Se convirtieron a PNG con el fondo transparente.
  # Cuando lleguen los SVG conviene regenerarlos, sobre todo la version blanca
  # para fondos oscuros, que no se puede derivar del JPEG.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700
  assets:
    - assets/marca/
    - assets/autos/galeria/
    - assets/autos/
    - assets/Manuales/Nissan/March/2020/
    - assets/Manuales/Nissan/Kicks/2023/
    - assets/Manuales/Nissan/Versa/2024/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Icono de la app (se regenera con `dart run flutter_launcher_icons:main`).
flutter_icons:
  android: true
  ios: true
  image_path: assets/marca/agencia360-icono.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/marca/agencia360-icono.png
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

# Pantalla de arranque. Ya esta generada; para regenerarla agrega
# flutter_native_splash a dev_dependencies, corre `dart run flutter_native_splash:create`
# y quitala otra vez (su plugin de Android no declara namespace y rompe el build).
# En Android el splash del sistema es solo azul (sin logo) para que se vea
# directo la cortina de Flutter; ver res/values/colors_arranque.xml.
flutter_native_splash:
  color: "#1D3557"
  android_12:
    color: "#1D3557"
