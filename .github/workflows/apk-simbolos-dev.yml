name: APK y símbolos de dev

on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/apk-simbolos-dev.yml"
      - "tool/verificar_simbolos_android.sh"
  push:
    branches: [dev]
    paths:
      - ".github/workflows/apk-simbolos-dev.yml"
      - "tool/verificar_simbolos_android.sh"

permissions:
  contents: read

concurrency:
  group: apk-simbolos-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Verificar APK y símbolos de Android
    if: github.base_ref == 'dev' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Configurar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.x"
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar el APK de pruebas
        run: >
          flutter build apk --release --flavor pruebas -t lib/main_pruebas.dart
          --build-number=${{ github.run_number }} --split-debug-info=build/simbolos/android

      - name: Verificar los símbolos del APK
        shell: bash
        run: |
          bash tool/verificar_simbolos_android.sh \
            build/app/outputs/flutter-apk/app-pruebas-release.apk \
            build/simbolos/android "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" |
            tee build/simbolos/android/verificacion.txt

      - name: Guardar APK y símbolos
        uses: actions/upload-artifact@v7
        with:
          name: carecar-dev-apk-y-simbolos-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-pruebas-release.apk
            build/simbolos/android/
          if-no-files-found: error
