name: Release

# Publica un GitHub Release con el APK al empujar una etiqueta vX.Y.Z.
# Cómo sacar una versión: ver plan/modulos/T04-entrega-continua.md.
on:
  push:
    tags: ["v*.*.*"]

# Permisos mínimos: solo este workflow puede escribir contenido (crear el
# Release). El CI normal solo lee.
permissions:
  contents: write

# Dos etiquetas seguidas no deben pisarse, pero tampoco se cancela un release
# a medio publicar.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.x"

jobs:
  release:
    name: Release (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          # Historial completo para comprobar que la etiqueta está en main.
          fetch-depth: 0

      # La etiqueta debe ser vX.Y.Z y coincidir con la versión de pubspec.yaml
      # (la fuente única). Si no, se falla antes de compilar.
      - name: Verificar que la etiqueta coincide con pubspec.yaml
        id: version
        env:
          ETIQUETA: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*$/\1/p' pubspec.yaml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::No se pudo leer 'version' de pubspec.yaml."
            exit 1
          fi
          if [ "$ETIQUETA" != "v$version" ]; then
            echo "::error::La etiqueta $ETIQUETA no coincide con la versión de pubspec.yaml (v$version). Sube la versión en pubspec.yaml por PR, intégrala a main y vuelve a etiquetar (borra la etiqueta equivocada: git push origin :refs/tags/$ETIQUETA)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::La etiqueta $ETIQUETA apunta a un commit que no está en main. Etiqueta siempre un commit ya integrado."
            exit 1
          fi
          echo "nombre=$version" >> "$GITHUB_OUTPUT"

      # La app no tiene dirección del servidor por omisión: sin API_BASE_URL el
      # APK solo muestra el error de arranque. Se toma de la variable del
      # repositorio (Settings → Secrets and variables → Actions → Variables).
      - name: Verificar la dirección del servidor (API_BASE_URL)
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Falta la variable de repositorio API_BASE_URL (p. ej. http://IP-DE-LA-PC:8089/api/v1/app). Créala en Settings → Secrets and variables → Actions → Variables y vuelve a etiquetar."
            exit 1
          fi

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Configurar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Sin llaves de producción (V2-T04.02) android/app/build.gradle.kts firma
      # el release con la llave de debug.
      - name: Compilar el APK
        env:
          NOMBRE: ${{ steps.version.outputs.nombre }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build apk --release --build-name="$NOMBRE" --build-number=${{ github.run_number }} --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Nombrar el APK con su versión
        env:
          ETIQUETA: ${{ github.ref_name }}
        run: cp build/app/outputs/flutter-apk/app-release.apk "carecar-$ETIQUETA.apk"

      - name: Crear el GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ github.ref_name }}
          NUMERO: ${{ github.run_number }}
        run: |
          gh release create "$ETIQUETA" "carecar-$ETIQUETA.apk" \
            --title "CareCar $ETIQUETA" \
            --verify-tag \
            --notes "APK de Android $ETIQUETA (build $NUMERO).

          **Aviso:** este APK está firmado con la llave de debug porque aún no existe la firma de producción (V2-T04.02). Sirve para pruebas internas; no es apto para tiendas."
