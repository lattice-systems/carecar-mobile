name: Release

# Publica un GitHub Release con el APK al empujar una etiqueta vX.Y.Z y luego le
# adjunta el IPA sin firmar (workflow ipa-sin-firma.yml, para Sideloadly).
# Cómo sacar una versión: ver plan/modulos/T04-entrega-continua.md.
on:
  push:
    tags: ["v*.*.*"]

# Permisos mínimos: solo este workflow puede escribir contenido (crear el
# Release). El CI normal solo lee.
permissions:
  contents: write

# Dos etiquetas seguidas no deben pisarse, pero tampoco se cancela un release
# a medio publicar.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.x"

jobs:
  release:
    name: Release (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          # Historial completo para comprobar que la etiqueta está en main.
          fetch-depth: 0

      # La etiqueta debe ser vX.Y.Z y coincidir con la versión de pubspec.yaml
      # (la fuente única). Si no, se falla antes de compilar.
      - name: Verificar que la etiqueta coincide con pubspec.yaml
        id: version
        env:
          ETIQUETA: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*$/\1/p' pubspec.yaml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::No se pudo leer 'version' de pubspec.yaml."
            exit 1
          fi
          if [ "$ETIQUETA" != "v$version" ]; then
            echo "::error::La etiqueta $ETIQUETA no coincide con la versión de pubspec.yaml (v$version). Sube la versión en pubspec.yaml por PR, intégrala a main y vuelve a etiquetar (borra la etiqueta equivocada: git push origin :refs/tags/$ETIQUETA)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::La etiqueta $ETIQUETA apunta a un commit que no está en main. Etiqueta siempre un commit ya integrado."
            exit 1
          fi
          echo "nombre=$version" >> "$GITHUB_OUTPUT"

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Configurar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # V2-T04.02: la llave de producción viene de GitHub Secrets; sin ella
      # android/app/build.gradle.kts firma el release con la llave de debug.
      - name: Preparar la firma de producción
        id: firma
        env:
          LLAVE_BASE64: ${{ secrets.ANDROID_PRODUCCION_LLAVE_BASE64 }}
          LLAVE_CONTRASENA: ${{ secrets.ANDROID_PRODUCCION_LLAVE_CONTRASENA }}
          LLAVE_ALIAS: ${{ secrets.ANDROID_PRODUCCION_LLAVE_ALIAS }}
        run: scripts/preparar-firma-android.sh

      # Flavor produccion (V2-T01.04): su dirección por omisión es el backend
      # de Azure; la variable de repositorio API_BASE_URL, si existe, la
      # sobrescribe (debe ser https).
      - name: Compilar el APK
        env:
          NOMBRE: ${{ steps.version.outputs.nombre }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          extra=()
          if [ -n "$API_BASE_URL" ]; then extra+=("--dart-define=API_BASE_URL=$API_BASE_URL"); fi
          flutter build apk --release --flavor produccion -t lib/main_produccion.dart --build-name="$NOMBRE" --build-number=${{ github.run_number }} "${extra[@]}"

      - name: Nombrar el APK con su versión
        env:
          ETIQUETA: ${{ github.ref_name }}
        run: cp build/app/outputs/flutter-apk/app-produccion-release.apk "carecar-$ETIQUETA.apk"

      - name: Crear el GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ github.ref_name }}
          NUMERO: ${{ github.run_number }}
          FIRMADO: ${{ steps.firma.outputs.firmado }}
        run: |
          if [ "$FIRMADO" = true ]; then
            firma="Firmado con la llave de producción."
          else
            firma="**Aviso:** firmado con la llave de debug porque el repositorio aún no tiene los secretos de producción (V2-T04.02, scripts/crear-llaves-android.sh). Sirve para pruebas internas; no es apto para tiendas."
          fi
          gh release create "$ETIQUETA" "carecar-$ETIQUETA.apk" \
            --title "CareCar $ETIQUETA" \
            --verify-tag \
            --notes "APK de Android $ETIQUETA (build $NUMERO).

          $firma

          El IPA de iOS (sin firmar, para instalar con Sideloadly) se adjunta unos minutos después; guía en docs/guia-instalar-ios-sin-mac.md."

  # El IPA va en un job aparte, después del Release: si la etiqueta no pasa la
  # verificación no se gastan minutos de macOS, y si falla el build de iOS el
  # APK ya quedó publicado. La compilación es la misma que la del lanzamiento
  # manual (ipa-sin-firma.yml), así hay una sola receta.
  ipa:
    name: IPA sin firma
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/ipa-sin-firma.yml
    with:
      etiqueta: ${{ github.ref_name }}

  adjuntar-ipa:
    name: Adjuntar el IPA al Release
    needs: ipa
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el IPA
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.ipa.outputs.archivo }}
          path: ipa

      - name: Adjuntar el IPA al Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ETIQUETA: ${{ github.ref_name }}
        run: |
          archivo=$(find ipa -name '*.ipa' | head -n 1)
          if [ -z "$archivo" ]; then
            echo "::error::No se encontró el IPA descargado."
            exit 1
          fi
          gh release upload "$ETIQUETA" "$archivo" --clobber
