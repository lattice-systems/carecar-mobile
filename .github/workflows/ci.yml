name: CI

# Corre en cada PR hacia main y en cada push a main (al integrar). Las ramas de
# feature no corren con su push: las cubre su PR, así cada cambio compila una
# vez y no dos. Abre el PR temprano (aunque sea en borrador) para tener CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Si llegan varios push seguidos a la misma rama o PR, cancela la corrida
# anterior: no tiene sentido esperar un build viejo si ya hay uno más nuevo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Versión de Flutter para todos los jobs. "3.47.x" toma el último parche de la
# 3.47, la misma línea que pide el README.
env:
  FLUTTER_VERSION: "3.47.x"

# Cada revisión es un job aparte (corren en paralelo): así en el PR aparece un
# check por cada una y se ve de inmediato qué falló.
#
# subosito/flutter-action es de terceros, así que se fija al hash del commit (no
# a la etiqueta v2, que se puede mover). Para actualizarla, cambia el hash y el
# comentario con la versión en los jobs de código.
jobs:
  # Decide si el PR toca código de la app. Si solo cambia documentación (docs/,
  # plan/, .claude/, .githooks/ o archivos .md), los demás jobs se saltan: un job
  # saltado cuenta como aprobado para los checks requeridos, así que no traba el
  # merge. En push a main y en ejecución manual siempre corre todo.
  cambios:
    name: Detectar cambios de código
    runs-on: ubuntu-latest
    outputs:
      codigo: ${{ steps.revisar.outputs.codigo }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Revisar qué archivos cambiaron
        id: revisar
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" != "pull_request" ]; then
            echo "codigo=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # En un PR, HEAD es el merge de prueba: su primer padre es main.
          archivos=$(git diff --name-only HEAD^1 HEAD)
          echo "$archivos"
          if [ -z "$archivos" ] || echo "$archivos" | grep -Evq '^(docs/|plan/|\.claude/|\.githooks/)|\.md$'; then
            echo "codigo=true" >> "$GITHUB_OUTPUT"
          else
            echo "Solo documentación: se saltan formato, análisis, pruebas y builds."
            echo "codigo=false" >> "$GITHUB_OUTPUT"
          fi

  formato:
    name: Formato (dart format)
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Revisar formato (dart format . si falla, en local)
        run: dart format --output=none --set-exit-if-changed lib test integration_test

  analisis:
    name: Análisis estático (flutter analyze)
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Revisar el código con las reglas de analysis_options.yaml
        run: flutter analyze --fatal-infos --fatal-warnings

  pruebas:
    name: Pruebas (flutter test)
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Configurar Node para el contrato de la API simulada
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mock_api/package-lock.json

      - name: Instalar dependencias de la API simulada
        run: npm ci --prefix mock_api

      - name: Correr las pruebas
        run: flutter test --coverage --reporter expanded --dart-define=PROBAR_MOCK_API=true

      - name: Resumir la cobertura
        if: success() || (!cancelled() && hashFiles('coverage/lcov.info') != '')
        run: node tool/resumir_cobertura.js | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Guardar LCOV
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-carecar
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Guardar diferencias de las pruebas golden
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diferencias-golden
          path: test/**/failures/*.png
          if-no-files-found: ignore

  integracion-android:
    name: Integración Android con mock_api
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Configurar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mock_api/package-lock.json

      - name: Instalar dependencias
        run: |
          flutter pub get
          npm ci --prefix mock_api

      - name: Habilitar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ejecutar el flujo de citas en el emulador
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: bash tool/probar_flujo_android.sh "emulator-$EMULATOR_PORT"

  build-android:
    name: Build Android (APK)
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # Gradle necesita un JDK para compilar el proyecto Android. La caché de
      # Gradle (dependencias y wrapper) evita descargarlas en cada build.
      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Configurar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Build de debug: comprueba que la app compila para Android sin necesitar
      # las llaves de firma de producción. El nombre de versión sale del
      # `version` de pubspec.yaml y el número de build de la corrida de CI
      # (github.run_number, siempre creciente), así cada APK es distinguible.
      # Se compilan los tres flavors (V2-T01.04) para que ninguno se rompa.
      - name: Compilar el APK (desarrollo)
        run: flutter build apk --debug --flavor desarrollo -t lib/main_desarrollo.dart --build-number=${{ github.run_number }}

      - name: Compilar el APK (pruebas)
        run: flutter build apk --debug --flavor pruebas -t lib/main_pruebas.dart --build-number=${{ github.run_number }}

      - name: Compilar el APK (produccion)
        run: flutter build apk --debug --flavor produccion -t lib/main_produccion.dart --build-number=${{ github.run_number }}

  build-ios:
    name: Build iOS (sin firma)
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    # Xcode solo existe en macOS. Se compila sin firmar: comprueba que el
    # proyecto iOS compila sin certificados ni perfiles de Apple.
    runs-on: macos-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # desarrollo es el único con ATS abierto (Info-desarrollo.plist) y
      # produccion el más restrictivo: con los dos se prueban ambos Info.plist.
      - name: Compilar para iOS sin firmar (desarrollo)
        run: flutter build ios --no-codesign --flavor desarrollo -t lib/main_desarrollo.dart

      - name: Compilar para iOS sin firmar (produccion)
        run: flutter build ios --no-codesign --flavor produccion -t lib/main_produccion.dart
