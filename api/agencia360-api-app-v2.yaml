openapi: 3.0.3
info:
  title: Agencia360 · API para la app CareCar v2
  version: 2.26.0
  description: |
    Contrato de API que Agencia360 expone a la app CareCar v2.

    Nace como copia de `agencia360-api-app-v1.yaml` en su versión 1.4.0 y crece con los
    endpoints nuevos de la v2. Es compatible con la v1: las rutas siguen bajo `/api/v1/app` y la
    app v1 instalada sigue funcionando sin cambios. `agencia360-api-app-v1.yaml` queda congelado
    como referencia de la app v1; todo cambio nuevo entra solo en este archivo.

    Convenciones:
    - Todas las rutas van bajo `/api/v1/app` y requieren token JWT, excepto login, refrescar,
      cerrar sesión, recuperar y restablecer la contraseña.
    - El cliente solo puede ver y modificar sus propios datos; un recurso ajeno responde 404.
    - Si la cuenta se desactiva, toda ruta protegida responde 403 con
      `codigo: CUENTA_DESACTIVADA`, aunque el token siga vigente.
    - Fechas en ISO 8601 (`2026-10-20`), horas en `HH:mm`. Las fechas y horas de citas,
      franjas y servicios son hora local de la agencia, sin zona: la app las muestra tal cual,
      sin convertirlas a la zona del dispositivo.
    - Las listas que crecen con el tiempo se paginan con `pagina` (desde 0) y `tamano`
      (20 por omisión, máximo 50).
    - Errores con el formato `ApiError` que ya usa el backend (`shared/exception/ApiError.java`).
      El `message` está escrito para el usuario en 401, 403, 404, 409 y 429; en 400 y 5xx la app
      muestra un texto propio. Cuando viene `codigo`, la app decide por él y no por el texto.

    Versionado: `info.version` sigue versionado semántico a partir de 2.0.0. Una versión menor
    solo agrega campos o rutas opcionales; un cambio incompatible va en una ruta nueva
    (`/api/v2/app`) y la ruta anterior sigue respondiendo igual mientras exista la app v1.

    Tiempo real (V2-T05.08): `GET /eventos` manda avisos por Server-Sent Events. El chat usa
    WebSocket STOMP en `/ws` (fuera de `/api/v1/app`): el frame `CONNECT` lleva
    `Authorization: Bearer <accessToken>`; sin token o con uno inválido el servidor responde
    con un frame `ERROR` y cierra. Solo se puede suscribir a `/user/queue/...` y mandar a
    `/app/...`; cada módulo que lo use (M07) documenta aquí sus destinos.

    Archivos (V2-T05.09): las fotos y documentos se descargan con una URL temporal firmada que
    arma el backend (`/api/v1/archivos/{carpeta}/{id}?expira=&firma=`, fuera de
    `/api/v1/app`). Vence a los 15 minutos y no pide token; si venció, la app vuelve a pedir el
    recurso que la trae.

    Cómo se cambia: cada historia escribe sus rutas y esquemas bajo la etiqueta de su módulo
    antes de programarlas, sin reordenar ni reformatear lo de otros, y sube la versión menor. Al
    integrar, se copia este archivo a `carecar-mobile/api/`.

servers:
  - url: /api/v1/app

tags:
  - name: Tienda
    description: Productos compatibles, apartados y pedidos (V2-M14)
  - name: Acceso
    description: APP-2.1, APP-2.2 y APP-2.3
  - name: Vehículos
    description: APP-3.1
  - name: Servicios y tickets
    description: APP-3.2 y ERP-3.1
  - name: Agenda
    description: APP-3.3 y ERP-3.3
  - name: Catálogo
    description: APP-4.1 (fuera del MVP; incluido porque TEC-1 lo pide en el contrato)
  - name: Toma a cuenta
    description: V2-M03.04, V2-M03.06 y V2-M03.07
  - name: Asistente
    description: V2-M24.02 y V2-M24.03 (ADR 0007)
  - name: Asistencia
    description: V2-M11.01
  - name: Recolección
    description: V2-M17.01 y V2-M17.02
  - name: En vivo
    description: V2-T05.08
  - name: Taller en vivo
    description: V2-M04.01, V2-M04.02, V2-M04.04 y V2-M04.05
  - name: Mantenimiento
    description: V2-M05.01, V2-M05.02, V2-M05.03 y V2-M05.06
  - name: Garantía y campañas
    description: V2-M10.01, V2-M10.02 y V2-M10.03
  - name: Lealtad
    description: V2-M12.01, V2-M12.03, V2-M12.04 y V2-M12.05
  - name: Pagos y facturas
    description: |
      V2-M08.02, V2-M08.04, V2-M08.05 y V2-M08.07 · Pagar una orden, tarjetas guardadas, datos
      fiscales y mis pagos. Los pagos y las facturas de M08 son simulados (ADR 0009 de
      carecar-mobile): no hay procesador ni proveedor de timbrado externos y no se cobra nada.
      La app nunca manda el número de una tarjeta: manda el token de una de las tarjetas de
      prueba (`tok_sim_visa`, `tok_sim_mastercard`, `tok_sim_visa_debito`,
      `tok_sim_fondos_insuficientes`, `tok_sim_3ds` y `tok_sim_3ds_falla`).
  - name: Bitácora
    description: V2-M18.01 y V2-M18.04
  - name: Privacidad
    description: V2-M22.01, V2-M22.02 y V2-M22.03
  - name: Valuación
    description: V2-M26.01 a V2-M26.05

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Acceso]
      summary: Iniciar sesión con la cuenta que entregó la agencia
      description: |
        No existe registro público (APP-2.1). El cliente entra con su correo, que es el
        usuario de su cuenta (`cuenta_app.usuario`, V2-T05.03); si la agencia cambia el
        correo del cliente, el usuario cambia con él.
        Si la cuenta tiene contraseña temporal, `debeCambiarContrasena` llega en `true`
        y la app debe forzar el cambio (APP-2.3).

        Después de 5 intentos fallidos seguidos con el mismo correo, el login se bloquea
        15 minutos y responde 429. La cuenta desactivada solo se informa (403) cuando la
        contraseña es correcta; si no, responde 401 como cualquier credencial inválida.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          description: Correo o contraseña incorrectos (`codigo` CREDENCIALES_INVALIDAS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /auth/refrescar:
    post:
      tags: [Acceso]
      summary: Obtener un token nuevo con el refresh token
      description: |
        Cada refresh token se usa una sola vez: la respuesta trae un par nuevo y el
        anterior queda revocado. La app guarda siempre el último. El refresh token
        vence a los 30 días.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens nuevos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Refresh token inválido, usado, revocado o vencido. La app vuelve al login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'

  /auth/cerrar-sesion:
    post:
      tags: [Acceso]
      summary: Cerrar la sesión y revocar el refresh token
      description: |
        No pide el access token, para que funcione aunque ya haya vencido. El access
        token sigue siendo válido hasta su vencimiento (`expiresIn`); la app lo descarta.
        Responde 204 aunque el refresh token ya no sea válido.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Sesión cerrada

  /auth/cambiar-contrasena:
    post:
      tags: [Acceso]
      summary: Cambiar la contraseña (obligatorio en el primer ingreso)
      description: |
        APP-2.3 · Sprint 2. La contraseña nueva debe cumplir las reglas de
        `CambiarContrasenaRequest` y ser distinta de la actual.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarContrasenaRequest'
      responses:
        '204':
          description: Contraseña actualizada
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'

  /auth/recuperar-contrasena:
    post:
      tags: [Acceso]
      summary: Solicitar un enlace de recuperación por correo
      description: |
        APP-2.3 · V2-T05.04. Envía al correo un enlace de un solo uso que abre la app
        (`carecar://restablecer-contrasena?token=...`, configurable con
        `RECUPERACION_ENLACE`) y, para la app v1, un código de 6 dígitos. Los dos vencen a
        los 15 minutos, viven en la misma fila de `token_recuperacion` y usar uno cierra el
        otro. Pedir uno nuevo invalida el anterior. Responde 202 aunque el correo no
        exista, para no revelar qué cuentas hay.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo]
              properties:
                correo:
                  type: string
                  format: email
      responses:
        '202':
          description: Solicitud recibida
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /auth/restablecer-contrasena:
    post:
      tags: [Acceso]
      summary: Definir nueva contraseña con el enlace o el código de recuperación
      description: |
        APP-2.3 · V2-T05.04. La app v2 manda `token` (el del enlace); la app v1 manda
        `correo` y `codigo`. El código admite 5 intentos; después hay que pedir otro. Al
        restablecer se cierran las sesiones abiertas de la cuenta.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestablecerContrasenaRequest'
      responses:
        '204':
          description: Contraseña restablecida
        '400':
          description: |
            Enlace o código inválido, usado o vencido (`codigo` CODIGO_INVALIDO); falta el
            `token` o el `correo` con el `codigo`, o la contraseña no cumple las reglas
            (`codigo` DATOS_INVALIDOS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /perfil:
    get:
      tags: [Acceso]
      summary: Datos del cliente que inició sesión
      description: APP-2.2 · Solo lectura. Editar el correo es `PATCH /perfil`.
      responses:
        '200':
          description: Datos del cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
    patch:
      tags: [Acceso]
      summary: Pedir el cambio del correo
      description: |
        V2-M01.07 · **No cambia nada todavía**: crea una verificación y manda un código de
        6 dígitos al correo nuevo. El cambio se aplica en
        `POST /perfil/verificaciones/{id}/confirmar`.

        Guardar el correo antes de confirmarlo dejaría al cliente con uno que no ha probado
        que es suyo y, como `cuenta_app.usuario` sigue al correo, **sin poder entrar**.

        **Pide la contraseña actual.** El correo es la identidad con la que se entra, así que
        sin eso alguien con el celular desbloqueado del cliente podría cambiarlo al suyo,
        recibir el código en su propio buzón y quedarse con la cuenta. Es el mismo requisito
        que para cancelar la cuenta.

        El teléfono **todavía no se puede cambiar**: verificarlo exige mandar un código por
        SMS y no hay con qué. Se agregará aquí cuando exista.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioDeCorreoRequest'
      responses:
        '202':
          description: Verificación creada; el código va al correo nuevo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificacionPendiente'
        '400':
          description: |
            Se distinguen por `codigo`, y la pantalla necesita distinguirlos:
            `CREDENCIALES_INVALIDAS` si la contraseña no coincide (400 y no 401 a propósito:
            la app lee un 401 como sesión vencida y cerraría la sesión sin explicar nada) y
            `DATOS_INVALIDOS` si el correo no tiene formato o falta un campo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '409':
          description: Ese correo ya es de otro cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /perfil/verificaciones/{id}/confirmar:
    post:
      tags: [Acceso]
      summary: Confirmar el cambio con el código
      description: >
        V2-M01.07 · Aplica el cambio pedido en `PATCH /perfil`. El código vence a los 15
        minutos y sirve una sola vez. Al cambiar el correo cambia también
        `cuenta_app.usuario` (V2-T05.03). **No cierra las demás sesiones**: es la misma
        persona y echarla de sus otros dispositivos por corregir su correo sería gratuito.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmarVerificacionRequest'
      responses:
        '200':
          description: El perfil ya actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '400':
          description: >
            `CODIGO_INVALIDO` si el código es equivocado, venció o ya se usó, igual que al
            restablecer la contraseña; `DATOS_INVALIDOS` si no viene el código.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          description: No existe esa verificación o no es de este cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'
        '409':
          description: Ese correo ya es de otro cliente (alguien lo tomó mientras se verificaba)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /sesiones:
    get:
      tags: [Acceso]
      summary: Sesiones abiertas del cliente
      description: >
        V2-M01.09 · Las sesiones **vigentes** de la cuenta: ni revocadas ni vencidas.
        Vienen ordenadas por `ultimoUso` descendente, y las que nunca se han refrescado
        al final. No se devuelve nada derivado del refresh token.
      responses:
        '200':
          description: Sesiones vigentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SesionActiva'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
    delete:
      tags: [Acceso]
      summary: Cerrar todas las sesiones
      description: >
        V2-M01.09 · Revoca **todas** las sesiones de la cuenta, **incluida la de quien
        llama**: es «cerrar sesión en todos los dispositivos». El access token en curso
        sigue valiendo hasta que expire, igual que en `/auth/cerrar-sesion`.
      responses:
        '204':
          description: Sesiones revocadas
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'

  /sesiones/{id}:
    delete:
      tags: [Acceso]
      summary: Cerrar una sesión
      description: >
        V2-M01.09 · Revoca esa sesión. Idempotente: una sesión ya revocada responde 204
        igual. Una sesión de otra cuenta responde **404**, no 403, como el resto del
        contrato para un recurso ajeno.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Sesión revocada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          description: No existe o no es de este cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /vehiculos:
    get:
      tags: [Vehículos]
      summary: Listar los vehículos del cliente
      description: |
        APP-3.1 · Un cliente puede tener varios vehículos; vienen en el orden en que se le
        asignaron.
      responses:
        '200':
          description: Vehículos asignados al cliente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehiculo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'

  /vehiculos/{vehiculoId}/manuales:
    get:
      tags: [Vehículos]
      summary: Manuales de la marca, tipo y modelo del vehículo
      description: |
        APP-3.1 · Los manuales son de una marca, un tipo y un modelo (por ejemplo, Nissan March
        2026); la versión no cambia el manual. La lista puede venir vacía si la agencia todavía no
        sube el manual de ese vehículo. Cada `url` es temporal: ábrela directo, sin el Bearer.
      parameters:
        - $ref: '#/components/parameters/VehiculoId'
      responses:
        '200':
          description: Manuales disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Manual'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /vehiculos/{vehiculoId}/ficha-tecnica:
    get:
      tags: [Vehículos]
      summary: Ficha técnica del modelo del vehículo
      description: |
        V2-M02.04 · Especificaciones por marca, modelo y año agrupadas en secciones. Si la agencia
        aún no las carga, `secciones` viene vacía y la app usa su respaldo local.
      parameters:
        - $ref: '#/components/parameters/VehiculoId'
      responses:
        '200':
          description: Ficha técnica
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FichaTecnica'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /vehiculos/{vehiculoId}/servicios:
    get:
      tags: [Servicios y tickets]
      summary: Historial de servicios del vehículo
      description: |
        APP-3.2 · V2-M02.05. Orden cronológico, el más reciente primero. Paginado; la app
        pide la página siguiente al llegar al final (paginación infinita). `anio` filtra por
        el año del servicio.
      parameters:
        - $ref: '#/components/parameters/VehiculoId'
        - name: anio
          in: query
          required: false
          description: V2-M02.05 · Solo los servicios de ese año (1900 a 2100)
          schema:
            type: integer
            minimum: 1900
            maximum: 2100
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Órdenes de servicio del vehículo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaServicios'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /vehiculos/{vehiculoId}/servicios/anios:
    get:
      tags: [Servicios y tickets]
      summary: Años con servicios del vehículo
      description: V2-M02.05 · Para el filtro del historial, del más reciente al más antiguo.
      parameters:
        - $ref: '#/components/parameters/VehiculoId'
      responses:
        '200':
          description: Años con al menos un servicio
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                example: [2026, 2025]
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /servicios/{servicioId}:
    get:
      tags: [Servicios y tickets]
      summary: Ticket de una orden de servicio
      description: |
        V2-M02.06 · Mano de obra y refacciones con cantidad, precio e importe (cantidad ×
        precio), y los totales: `total` = `totalManoDeObra` + `totalRefacciones`. Los precios
        traen el IVA incluido; `subtotal` e `iva` se desglosan del total. El PDF del mismo
        ticket está en `/servicios/{servicioId}/ticket`.
      parameters:
        - name: servicioId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Ticket de la orden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicioDetalle'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /servicios/{servicioId}/ticket:
    get:
      tags: [Servicios y tickets]
      summary: Descargar el ticket de una orden de servicio
      description: |
        El ticket es un documento que genera la orden de servicio (decisión del 9 de octubre).
        Se descarga con el mismo token Bearer; el PDF viene en el cuerpo de la respuesta.
      parameters:
        - name: servicioId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Ticket en PDF
          headers:
            Content-Disposition:
              description: '`attachment; filename="ticket-{servicioId}.pdf"`'
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /agenda/disponibilidad:
    get:
      tags: [Agenda]
      summary: Horarios con cupo para agendar
      description: |
        APP-3.3 · ERP-3.3. Solo devuelve franjas activas con cupo mayor a cero. Las franjas y su
        capacidad salen de la tabla `franja_horario` (V2-T05.07); el cupo es la capacidad menos
        las citas confirmadas de esa franja en esa fecha.
      parameters:
        - name: desde
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Franjas disponibles por fecha
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Disponibilidad'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'

  /citas:
    get:
      tags: [Agenda]
      summary: Listar las citas del cliente
      description: |
        Ordenadas por fecha y hora de inicio. Los filtros son opcionales y se combinan.
        Próximas: `estado=CONFIRMADA&desde=<hoy>`. Pasadas: `hasta=<ayer>`.
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoCita'
        - name: desde
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          required: false
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Citas del cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaCitas'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
    post:
      tags: [Agenda]
      summary: Agendar una cita de servicio
      description: |
        APP-3.3 · La cita descuenta capacidad de la franja y no se puede reservar dos veces.
        Responde 400 si la franja no existe, no está activa o no es del día de `fecha`.
        V2-M17.02 · Con `recoleccion.direccionId` crea también los traslados de recoger y entregar
        en la misma transacción: si algo falla no queda ni cita ni traslados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaCita'
      responses:
        '201':
          description: Cita confirmada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cita'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            La franja ya no tiene cupo (`codigo` FRANJA_SIN_CUPO) o el vehículo ya tiene una cita
            confirmada ese día (`codigo` CITA_DUPLICADA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          $ref: '#/components/responses/FueraDeCobertura'

  /citas/{citaId}/cancelar:
    post:
      tags: [Agenda]
      summary: Cancelar una cita
      description: |
        APP-3.3 · El cliente puede cancelar hasta X horas antes. **El valor de X está pendiente del PO.**
        Los traslados de la cita que siguen `programado` pasan a `cancelado` en la misma
        operación; los que ya salieron no cambian (V2-M17.05).
      parameters:
        - name: citaId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Cita cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cita'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            Fuera del plazo de cancelación (`codigo` FUERA_DE_PLAZO) o la cita ya no está
            confirmada (`codigo` CITA_NO_CANCELABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /citas/{citaId}/reprogramar:
    post:
      tags: [Agenda]
      summary: Reprogramar una cita sin cancelarla
      description: |
        V2-M02.13 · Mueve la cita a otra franja (y opcionalmente otro día): libera la franja
        anterior y ocupa la nueva en la misma operación. Solo citas confirmadas que no han empezado.
        La franja debe ser del día de la cita, o del día de `fecha` si viene; si no, responde 400.
        Los traslados de la cita que siguen `programado` toman el día nuevo con la misma ventana
        horaria, en la misma operación; los que ya salieron no cambian (V2-M17.05).
      parameters:
        - name: citaId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprogramarCita'
      responses:
        '200':
          description: Cita reprogramada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cita'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            La nueva franja no tiene cupo (`codigo` FRANJA_SIN_CUPO), el vehículo ya tiene otra cita
            ese día (`codigo` CITA_DUPLICADA) o la cita ya no es reprogramable (`codigo`
            CITA_NO_REPROGRAMABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /citas/{citaId}/ticket:
    get:
      tags: [Agenda]
      summary: Descargar el comprobante PDF de una cita
      description: |
        PDF con un QR (`CARECAR-CITA:<id>.<firma>`) que recepción puede verificar; la firma es un
        HMAC-SHA256 con una llave que solo conoce el backend (V2-M02.11).
      parameters:
        - name: citaId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: PDF del comprobante
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /citas/{citaId}/comprobante:
    get:
      tags: [Agenda]
      summary: Código QR firmado de una cita
      description: |
        V2-M02.11 · `codigo` es el mismo texto del QR del PDF (`CARECAR-CITA:<id>.<firma>`).
        Solo citas confirmadas del cliente.
      parameters:
        - name: citaId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Datos del comprobante
          content:
            application/json:
              schema:
                type: object
                required: [citaId, codigo, fecha, horaInicio, horaFin]
                properties:
                  citaId:
                    type: integer
                    format: int64
                  codigo:
                    type: string
                  fecha:
                    type: string
                    format: date
                  horaInicio:
                    type: string
                  horaFin:
                    type: string
                  vehiculoNombre:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: La cita está cancelada (`codigo` CITA_CANCELADA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /citas/{citaId}/pase:
    get:
      tags: [Agenda]
      summary: Pase de Wallet de una cita
      description: |
        V2-M25.03 · El QR del pase es exactamente el `codigo` del comprobante
        (`CARECAR-CITA:<id>.<firma>`). `plataforma=apple` responde el `.pkpass` firmado;
        `plataforma=google` responde `{url}` con el enlace `https://pay.google.com/gp/v/save/<jwt>`.
        El pase vence al terminar la cita. Una cita cancelada no emite pase (409); un pase ya
        emitido no se revoca desde el servidor, pero recepción valida el QR contra el estado
        actual de la cita.
      parameters:
        - name: citaId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: plataforma
          in: query
          required: true
          schema:
            type: string
            enum: [apple, google]
      responses:
        '200':
          description: Pase listo para guardar
          content:
            application/vnd.apple.pkpass:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    example: https://pay.google.com/gp/v/save/eyJhbGciOiJSUzI1NiJ9...
        '400':
          description: La plataforma falta o no es apple ni google (`codigo` DATOS_INVALIDOS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: La cita está cancelada (`codigo` CITA_CANCELADA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'
        '503':
          description: Faltan las credenciales de esa plataforma (`codigo` WALLET_NO_CONFIGURADO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /asistencia:
    post:
      tags: [Asistencia]
      summary: Pedir ayuda con mi ubicación
      description: |
        V2-M11.01 · Crea una solicitud de asistencia (SOS) en estado `recibida`. La ubicación
        es opcional pero va completa: `lat` y `lng` juntas o ninguna. Cada cliente tiene a lo
        más una solicitud abierta (`recibida` o `en_camino`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaSolicitudAsistencia'
      responses:
        '201':
          description: Solicitud recibida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudAsistencia'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El cliente ya tiene una solicitud abierta (`codigo` SOLICITUD_ABIERTA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'
    get:
      tags: [Asistencia]
      summary: Mi solicitud de asistencia abierta
      description: |
        V2-M11.01 · Con `activa=true` devuelve la solicitud `recibida` o `en_camino` del
        cliente, o 204 sin cuerpo si no tiene ninguna. Cualquier otro valor de `activa` es 400.
      parameters:
        - name: activa
          in: query
          required: true
          schema:
            type: boolean
            enum: [true]
      responses:
        '200':
          description: La solicitud abierta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudAsistencia'
        '204':
          description: No hay solicitud abierta
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'

  /asistencia/{solicitudId}:
    get:
      tags: [Asistencia]
      summary: Una solicitud de asistencia mía
      description: |
        V2-M11.04 · Devuelve la solicitud con su estado actual (`recibida`, `en_camino`,
        `atendida` o `cancelada`). Al cerrarse (`atendida` o `cancelada`) el backend borra la
        ubicación y `lat` y `lng` vienen nulas. Cada cambio de estado llega en vivo por el
        evento `asistencia.estado` de `GET /eventos`. Una solicitud inexistente o de otro
        cliente responde 404.
      parameters:
        - name: solicitudId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: La solicitud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudAsistencia'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /direcciones:
    get:
      tags: [Recolección]
      summary: Listar mis direcciones
      description: V2-M17.01 · Las direcciones guardadas del cliente, por orden de alta.
      responses:
        '200':
          description: Direcciones del cliente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Direccion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
    post:
      tags: [Recolección]
      summary: Guardar una dirección
      description: |
        V2-M17.01 · El pin del mapa (`lat`, `lng`) es obligatorio. Si queda fuera de la zona de
        cobertura no se guarda y responde 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaDireccion'
      responses:
        '201':
          description: Dirección guardada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Direccion'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '422':
          $ref: '#/components/responses/FueraDeCobertura'

  /direcciones/{direccionId}:
    put:
      tags: [Recolección]
      summary: Editar una dirección
      description: V2-M17.01 · Reemplaza los datos de una dirección propia. Una ajena responde 404.
      parameters:
        - $ref: '#/components/parameters/DireccionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaDireccion'
      responses:
        '200':
          description: Dirección actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Direccion'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/FueraDeCobertura'
    delete:
      tags: [Recolección]
      summary: Borrar una dirección
      description: V2-M17.01 · Solo una propia y sin traslados.
      parameters:
        - $ref: '#/components/parameters/DireccionId'
      responses:
        '204':
          description: Dirección borrada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: La dirección ya tiene traslados (`codigo` DIRECCION_EN_USO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /recoleccion/cotizacion:
    get:
      tags: [Recolección]
      summary: Costo y franja de la recolección
      description: |
        V2-M17.02 · Para una dirección propia y un día en que el taller abre (hoy o después,
        dentro del plazo de anticipación). El costo por traslado es la tarifa base más la tarifa
        por kilómetro en línea recta al centro de la cobertura; el total son los dos traslados
        (recoger y entregar).
      parameters:
        - name: direccionId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: fecha
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Cotización
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionRecoleccion'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/FueraDeCobertura'

  /traslados/{trasladoId}:
    get:
      tags: [Recolección]
      summary: Estado de un traslado mío
      description: |
        V2-M17.03 · Estado del traslado de recoger o entregar. `ubicacionChofer` solo viene
        mientras el estado es `en_camino` o `de_regreso` y el chofer ya reportó su posición; en
        cualquier otro estado se omite. Los cambios llegan en vivo por los eventos
        `traslado.estado` y `traslado.ubicacion` de `GET /eventos`. Un traslado inexistente o de
        una cita de otro cliente responde 404.
      parameters:
        - $ref: '#/components/parameters/TrasladoId'
      responses:
        '200':
          description: El traslado con su seguimiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeguimientoTraslado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /traslados/{trasladoId}/checklist:
    get:
      tags: [Recolección]
      summary: Checklist de un traslado mío
      description: |
        V2-M17.04 · Lo que anotó el chofer al recoger o entregar: kilometraje, gasolina, notas,
        fotos y firma. `fotos` y `firmaUrl` son URL temporales firmadas
        (`/api/v1/archivos/{carpeta}/{id}?expira=&firma=`) que vencen a los 15 minutos; si
        vencen, la app vuelve a pedir el checklist. Responde 404 si el traslado es de otro
        cliente o todavía no tiene checklist.
      parameters:
        - $ref: '#/components/parameters/TrasladoId'
      responses:
        '200':
          description: El checklist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistTraslado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /catalogo:
    get:
      tags: [Catálogo]
      summary: Modelos actuales del catálogo
      description: Lista aparte del inventario que solo muestra los modelos actuales (decisión del 9 de octubre).
      responses:
        '200':
          description: Modelos activos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModeloCatalogo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'

  /catalogo/{modeloId}:
    get:
      tags: [Catálogo]
      summary: Detalle de un modelo del catálogo
      description: |
        V2-M03.02 · El modelo con su galería, las versiones que se venden de la misma marca,
        modelo y año, y una ficha resumida. Un modelo retirado o que no existe responde 404.
        `imagenes` y `especificaciones` pueden venir vacías mientras la agencia no las capture,
        y `versiones` siempre incluye la versión pedida.
      parameters:
        - $ref: '#/components/parameters/ModeloId'
      responses:
        '200':
          description: Detalle del modelo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalleModeloCatalogo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /estreno/cotizaciones/calculo:
    post:
      tags: [Estreno]
      summary: Calcular la mensualidad estimada de un auto nuevo
      description: |
        V2-M16.02 · No guarda nada. Pago fijo con la tasa y plazos de `parametro_financiamiento`
        sobre el `precioDesde` del modelo. Siempre trae la leyenda de estimación no vinculante.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculoEstreno'
      responses:
        '200':
          description: Mensualidad estimada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionEstreno'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El modelo no tiene precio publicado (`codigo` ESTRENO_SIN_PRECIO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /estreno/solicitudes:
    post:
      tags: [Estreno]
      summary: Pedir una prueba de manejo o una cotización
      description: |
        V2-M16.01, V2-M16.03 · Crea la solicitud; el CRM recibe un prospecto asignado a un vendedor
        (de forma asíncrona). `estimacionTomaCuentaId` opcional liga una estimación del cliente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaSolicitudEstreno'
      responses:
        '201':
          description: Solicitud creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudEstreno'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Ya hay una solicitud abierta del mismo modelo y tipo (`ESTRENO_DUPLICADA`) o el modelo no tiene precio (`ESTRENO_SIN_PRECIO`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'
    get:
      tags: [Estreno]
      summary: Mis solicitudes de estreno con su estado
      description: V2-M16.04 · Más recientes primero.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Página de solicitudes
          content:
            application/json:
              schema:
                type: object
                required: [contenido, pagina, tamano, totalElementos, totalPaginas]
                properties:
                  contenido:
                    type: array
                    items:
                      $ref: '#/components/schemas/SolicitudEstreno'
                  pagina:
                    type: integer
                  tamano:
                    type: integer
                  totalElementos:
                    type: integer
                  totalPaginas:
                    type: integer
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /privacidad/aviso:
    get:
      tags: [Privacidad]
      summary: El aviso de privacidad vigente y si ya lo acepté
      description: |
        V2-M22.01 · Texto versionado: un aviso publicado nunca se edita, la agencia publica una versión
        nueva. `aceptado` es `false` en el primer ingreso y cada vez que hay una versión nueva; la app pide
        aceptarla antes de seguir. El servidor no bloquea el resto de la API por no haberla aceptado.
      responses:
        '200':
          description: Aviso vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvisoPrivacidad'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /privacidad/aceptaciones:
    post:
      tags: [Privacidad]
      summary: Aceptar el aviso de privacidad vigente
      description: |
        V2-M22.01 · Registra que esta cuenta aceptó esa versión. Es idempotente: aceptar otra vez la misma
        versión devuelve la primera aceptación sin duplicarla.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AceptarAviso'
      responses:
        '200':
          description: Aceptación registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AceptacionAviso'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El aviso ya no es el vigente (`AVISO_NO_VIGENTE`), porque la agencia publicó una versión nueva que hay que leer y aceptar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /privacidad/arco:
    get:
      tags: [Privacidad]
      summary: Mis solicitudes de derechos ARCO
      description: |
        V2-M22.02 · Las últimas 20, más recientes primero, con su estado. Una solicitud de acceso
        `RESUELTA` trae su archivo hasta `venceEn`; después pasa a `VENCIDA` y hay que pedir otra.
      responses:
        '200':
          description: Solicitudes de la cuenta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SolicitudArco'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /privacidad/arco/acceso:
    post:
      tags: [Privacidad]
      summary: Pedir una copia de mis datos (acceso ARCO)
      description: |
        V2-M22.02 · Sin cuerpo. Responde 202 y prepara el archivo (JSON con los datos personales de la
        cuenta) sin hacer esperar; al estar listo llega el evento `arco.estado` de `GET /eventos` y la
        app consulta `GET /privacidad/arco`. Si ya hay una solicitud de acceso `PENDIENTE` la devuelve
        con 200 en vez de abrir otra. Pedir una nueva borra el archivo de la anterior.
      responses:
        '200':
          description: Ya había una solicitud de acceso pendiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudArco'
        '202':
          description: Solicitud recibida; el archivo se prepara
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudArco'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /privacidad/arco/cancelacion:
    post:
      tags: [Privacidad]
      summary: Borrar mi cuenta (cancelación ARCO)
      description: |
        V2-M22.03 · No se puede deshacer. Pide la contraseña como confirmación. Desactiva la cuenta
        (el siguiente request con cualquier token de ella responde 403 `CUENTA_DESACTIVADA`), cierra
        sus sesiones y borra o anonimiza los datos personales que ninguna ley obliga a conservar:
        contacto, direcciones, preguntas al asistente, estimaciones y solicitudes de estreno,
        bitácora de gastos y kilometraje, y la ubicación de las solicitudes de asistencia. Lo fiscal y
        comercial (ventas, pagos, facturas), el historial de servicio de los vehículos y la prueba de
        las aceptaciones del aviso de privacidad se conservan. La contraseña equivocada cuenta como
        intento fallido: a los 5 se bloquea 15 minutos y responde 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelarCuenta'
      responses:
        '200':
          description: Cuenta cancelada; la solicitud queda `RESUELTA`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudArco'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/DemasiadosIntentos'

  /privacidad/arco/{solicitudId}/archivo:
    get:
      tags: [Privacidad]
      summary: Descargar el archivo de una solicitud de acceso
      description: |
        V2-M22.02 · Solo la cuenta dueña, con su sesión; no hay enlace público. Responde el JSON como
        adjunto y sin caché. 404 si la solicitud no existe, es de otra cuenta, no está `RESUELTA` o ya
        venció.
      parameters:
        - name: solicitudId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Archivo con los datos de la cuenta
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /toma-a-cuenta/estimaciones:
    get:
      tags: [Toma a cuenta]
      summary: Listar mis estimaciones de toma a cuenta
      description: |
        V2-M03.07 · Las estimaciones del cliente, de la más reciente a la más antigua. Cada
        una trae lo que se pidió, el rango que salió y los supuestos con que se calculó, así
        que la app no recalcula nada: si la agencia cambia sus parámetros después, la
        estimación guardada sigue diciendo lo que dijo ese día.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Estimaciones del cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaEstimaciones'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
    post:
      tags: [Toma a cuenta]
      summary: Estimar cuánto me darían por mi auto a cuenta de uno nuevo
      description: |
        V2-M03.04 y V2-M03.06 · Calcula un rango mínimo y máximo con los parámetros que la
        agencia mantiene en `parametro_toma_cuenta` y lo guarda como una estimación del
        cliente. La fórmula vive solo en el backend.

        El auto se indica de una de dos formas, y mandar las dos o ninguna es un 400:
        `vehiculoId` (uno de los vehículos del cliente, de donde salen marca, modelo y año) o
        `marca`, `modelo` y `anio` capturados a mano. `modeloCatalogoId` es opcional y dice
        contra qué modelo nuevo se está estimando; si viene, el modelo debe estar vigente.

        **Es una estimación no vinculante, nunca una oferta.** La app lo dice siempre junto
        al rango, con un texto propio revisado por el PO. Una valuación formal se pide aparte
        (V2-M26.01).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaEstimacionTomaCuenta'
      responses:
        '201':
          description: Estimación calculada y guardada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimacionTomaCuenta'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          description: |
            El vehículo no existe o no es del cliente, o el modelo del catálogo no existe o
            está retirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          description: |
            La agencia todavía no tiene parámetros para esa marca, modelo y año
            (`codigo` SIN_PARAMETROS_DE_VALUACION). La app lo explica y ofrece pedir una
            valuación formal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /valuaciones:
    get:
      tags: [Valuación]
      summary: Listar mis valuaciones formales
      description: |
        V2-M26.01 · Las valuaciones del cliente, la más reciente primero, con su estado al día:
        una oferta cuya vigencia pasó llega como `VENCIDA` y una valuación cuya cita de
        inspección se canceló llega como `SOLICITADA` sin `cita`.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Valuaciones del cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaValuaciones'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
    post:
      tags: [Valuación]
      summary: Pedir una valuación formal desde una estimación
      description: |
        V2-M26.01 · Crea la solicitud ligada a una estimación del cliente hecha con uno de sus
        vehículos registrados, porque la inspección se agenda para ese vehículo. Hay una sola
        valuación abierta (`SOLICITADA`, `CITA_AGENDADA` u `OFERTADA`) por vehículo: si ya
        existe, responde 200 con ella y no crea otra, así que reintentar es seguro. La agencia
        recibe al cliente como prospecto de ventas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaValuacion'
      responses:
        '200':
          description: Ya había una valuación abierta para ese vehículo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Valuacion'
        '201':
          description: Valuación creada en `SOLICITADA`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Valuacion'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          description: |
            La estimación se hizo capturando el auto a mano, sin un vehículo registrado
            (`codigo` VALUACION_SIN_VEHICULO). La app explica que esa valuación se pide en la
            agencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /valuaciones/{valuacionId}:
    get:
      tags: [Valuación]
      summary: Ver una valuación
      description: |
        V2-M26.01 · Con sus fotos (URL temporal firmada, vence a los 15 minutos), la cita de
        inspección, la oferta y el asesor.
      parameters:
        - $ref: '#/components/parameters/ValuacionId'
      responses:
        '200':
          description: La valuación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Valuacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /valuaciones/{valuacionId}/fotos/{toma}:
    post:
      tags: [Valuación]
      summary: Subir o reemplazar una foto guiada
      description: |
        V2-M26.02 · Una foto por petición, en `multipart/form-data`. Volver a subir una toma
        la reemplaza, así que reintentar es seguro. Acepta JPEG o PNG de hasta 8 MB y 40
        megapíxeles. El servidor la reescribe sin EXIF ni ubicación antes de guardarla.
        Responde 400 `DATOS_INVALIDOS` si la toma no existe o el archivo no es una imagen
        válida.
      parameters:
        - $ref: '#/components/parameters/ValuacionId'
        - name: toma
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/TomaValuacion'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [imagen]
              properties:
                imagen:
                  type: string
                  format: binary
      responses:
        '200':
          description: La valuación con la foto nueva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Valuacion'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            La valuación ya no admite fotos porque no está en `SOLICITADA` ni en
            `CITA_AGENDADA` (`codigo` VALUACION_CERRADA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /valuaciones/{valuacionId}/cita:
    post:
      tags: [Valuación]
      summary: Agendar la inspección física
      description: |
        V2-M26.03 · Usa la agenda del taller con las mismas reglas que `POST /citas` y motivo
        `valuacion`. La disponibilidad se consulta con `GET /agenda/disponibilidad`. Se puede
        agendar en `SOLICITADA`, o en `CITA_AGENDADA` cuando la cita ya pasó hace más de 7
        días (configurable en el servidor) y no hubo oferta. Cancelar y reprogramar se hace
        con las rutas de `/citas`.
      parameters:
        - $ref: '#/components/parameters/ValuacionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgendarInspeccion'
      responses:
        '201':
          description: Cita confirmada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cita'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            La valuación ya tiene cita o ya no se puede agendar (`codigo`
            VALUACION_NO_AGENDABLE), la franja se llenó (`codigo` FRANJA_SIN_CUPO) o el
            vehículo ya tiene una cita ese día (`codigo` CITA_DUPLICADA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /valuaciones/{valuacionId}/respuesta:
    post:
      tags: [Valuación]
      summary: Aceptar o rechazar la oferta
      description: |
        V2-M26.04 · `monto` es el que el cliente vio en pantalla. Si no es el de la oferta
        actual no se registra nada. Repetir la misma decisión con el mismo monto responde 200
        sin cambios.
      parameters:
        - $ref: '#/components/parameters/ValuacionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespuestaOferta'
      responses:
        '200':
          description: La valuación en `ACEPTADA` o `RECHAZADA`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Valuacion'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            La vigencia de la oferta ya pasó (`codigo` OFERTA_VENCIDA), o no hay una oferta
            que responder con ese monto o ya se respondió lo contrario (`codigo`
            OFERTA_NO_DISPONIBLE). La app vuelve a consultar la valuación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /vehiculos/{vehiculoId}/valor-estimado:
    get:
      tags: [Valuación]
      summary: Cómo cambia el valor estimado de mi auto por mes
      description: |
        V2-M26.05 · Un punto por cada mes (hora de la agencia) en el que el cliente guardó una
        estimación de ese vehículo, con la más reciente de ese mes. Un mes sin estimación no
        aparece: no se interpola ni se recalcula hacia atrás. Del más antiguo al más reciente.
        Sin estimaciones responde la lista vacía. Es un historial no vinculante.
      parameters:
        - $ref: '#/components/parameters/VehiculoId'
        - name: meses
          in: query
          required: false
          description: Cuántos meses hacia atrás, contando el actual
          schema:
            type: integer
            minimum: 1
            maximum: 36
            default: 12
      responses:
        '200':
          description: El historial por mes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValorEstimado'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /tienda/productos:
    get:
      tags: [Tienda]
      summary: Ver los productos de la tienda
      description: |
        V2-M14.01 · Productos publicados en la app, por nombre. Con `vehiculoId` solo salen los
        universales y los compatibles con el modelo y año de ese vehículo. `existencia` son las
        piezas disponibles (las apartadas ya no cuentan). Un producto agotado sí se lista, con
        `existencia` en 0.
      parameters:
        - name: vehiculoId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: categoria
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CategoriaProducto'
        - name: q
          in: query
          required: false
          description: Texto a buscar en el nombre o el código, sin distinguir mayúsculas.
          schema:
            type: string
            maxLength: 80
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Productos publicados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaProductos'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /tienda/productos/{productoId}:
    get:
      tags: [Tienda]
      summary: Ver un producto
      description: |
        V2-M14.01 · Con `vehiculoId`, `compatible` dice si le queda a ese vehículo. Sin él no
        viene. Un producto sin publicar responde 404.
      parameters:
        - name: productoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: vehiculoId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /tienda/pedidos:
    get:
      tags: [Tienda]
      summary: Listar mis pedidos
      description: V2-M14.05 · El más reciente primero. Un apartado vencido llega como `cancelado`.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Pedidos del cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaPedidos'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
    post:
      tags: [Tienda]
      summary: Apartar productos
      description: |
        V2-M14.02 y V2-M14.03 · Crea un pedido `apartado` y reserva las piezas por tiempo
        limitado (48 horas, o hasta el final del día siguiente a la cita si es para instalar).
        O se apartan todos los renglones o ninguno. El precio queda fijo. No se cobra en la app:
        se paga en caja. Con `entrega: cita` hace falta `citaId` de una cita confirmada del
        cliente que no ha pasado, y todos los productos deben quedarle a ese vehículo. Repetir
        la misma `Idempotency-Key` responde 200 con el pedido ya creado.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoPedido'
      responses:
        '200':
          description: El pedido ya creado con esa llave
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '201':
          description: Pedido apartado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            `SIN_EXISTENCIA` (no alcanzan las piezas), `CITA_NO_DISPONIBLE` (la cita está cancelada
            o ya pasó) o `LIMITE_APARTADOS` (ya hay 3 pedidos sin entregar).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          description: |
            `PRODUCTO_INCOMPATIBLE`: algún producto no le queda al vehículo de la cita.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /tienda/pedidos/{pedidoId}:
    get:
      tags: [Tienda]
      summary: Ver un pedido
      description: V2-M14.05 · Con sus renglones, su cita y la hora de cada cambio de estado.
      parameters:
        - name: pedidoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /tienda/pedidos/{pedidoId}/cancelar:
    post:
      tags: [Tienda]
      summary: Cancelar un pedido
      description: |
        V2-M14.02 · Libera las piezas. Vale en `apartado` y `listo`. Repetirlo sobre un pedido
        ya cancelado responde 200.
      parameters:
        - name: pedidoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Pedido cancelado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            `PEDIDO_NO_CANCELABLE` (ya se entregó), `PEDIDO_PAGADO` (V2-M14.04: ya se pagó en la app
            y se cancela en mostrador) o `PAGO_EN_CURSO` (un intento de pago espera el 3-D Secure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /tienda/pedidos/{pedidoId}/instalacion:
    put:
      tags: [Tienda]
      summary: Elegir si el pedido se instala en una cita
      description: |
        V2-M14.03 · Con `citaId` el pedido pasa a `entrega: cita` y su vigencia llega hasta el
        final del día siguiente a la cita. Con `citaId` nulo vuelve a recogerse en mostrador,
        con 48 horas de vigencia. Si la cita se cancela, el pedido vuelve solo a mostrador, y si
        se reprograma su vigencia se mueve con ella.
      parameters:
        - name: pedidoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstalacionPedido'
      responses:
        '200':
          description: Pedido actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            `CITA_NO_DISPONIBLE` o `PEDIDO_NO_MODIFICABLE` (ya se entregó o se canceló).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          description: |
            `PRODUCTO_INCOMPATIBLE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /asistente/preguntas:
    post:
      tags: [Asistente]
      summary: Preguntarle al asistente algo de mi auto
      description: |
        V2-M24.03 · Responde con base en el manual de propietario del modelo y año del
        vehículo, citando las páginas que usó. Si el manual no lo dice, `encontrado` es false,
        no hay fuentes y la respuesta lo dice sin inventar.

        Lo genera un modelo de IA (Gemini, nivel gratis; ADR 0007) llamado solo desde el
        backend. Al modelo solo le llegan la pregunta sin datos personales (el backend quita
        correo, teléfono, VIN y placas), el modelo y año, y páginas del manual. La app muestra
        siempre el aviso de que la respuesta la generó una IA.

        Límites: 10 preguntas por cliente al día (`429` ASISTENTE_LIMITE, con `Retry-After`
        hasta la medianoche de la agencia) y un tope global diario (`503`
        ASISTENTE_NO_DISPONIBLE, igual que si el proveedor falla o se agota su cuota).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreguntaAsistente'
      responses:
        '200':
          description: Respuesta del asistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAsistente'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El modelo y año del vehículo no tienen un manual con texto (`codigo` ASISTENTE_SIN_MANUAL)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'
        '429':
          description: Ya hizo sus preguntas del día (`codigo` ASISTENTE_LIMITE)
          headers:
            Retry-After:
              description: Segundos que faltan para la medianoche de la agencia
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'
        '503':
          description: Sin cuota del día o el proveedor de IA no responde (`codigo` ASISTENTE_NO_DISPONIBLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /vehiculos/{vehiculoId}/mantenimiento:
    get:
      tags: [Mantenimiento]
      summary: Plan de mantenimiento del vehículo
      description: |
        V2-M05.01, V2-M05.02 y V2-M05.06 · El plan del modelo y año del vehículo, con lo que
        incluye cada servicio y su precio estimado (estimación no vinculante). `hecho` se cruza
        con las órdenes cerradas del historial. `proximo` estima cuándo toca el siguiente por
        km (promedio diario de las lecturas) y por tiempo (meses); gana lo que llegue primero.
        Sin plan para ese modelo y año responde 200 con `servicios` vacío y `proximo` nulo.
      parameters:
        - $ref: '#/components/parameters/VehiculoId'
      responses:
        '200':
          description: Plan del vehículo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanMantenimiento'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /vehiculos/{vehiculoId}/lecturas-km:
    post:
      tags: [Mantenimiento]
      summary: Registrar mi kilometraje actual
      description: |
        V2-M05.03 · Guarda una lectura de fuente `cliente`. El kilometraje oficial del taller
        no se sobrescribe. Un `km` menor a la última lectura oficial o a la última del cliente
        responde 422 con `codigo` KM_INVALIDO; igual sí se acepta.

        Con `multipart/form-data` se puede adjuntar una `foto` opcional del tablero (imagen JPEG,
        PNG o WebP). El `km` se valida primero y solo después se guarda la foto; una foto que no es
        imagen responde 400. La respuesta trae `fotoUrl`, una URL temporal firmada que vence a los
        15 minutos. El cuerpo JSON de siempre sigue funcionando igual y no trae `fotoUrl`.
      parameters:
        - $ref: '#/components/parameters/VehiculoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaLecturaKm'
          multipart/form-data:
            schema:
              type: object
              required: [km]
              properties:
                km:
                  type: integer
                  minimum: 1
                  maximum: 2000000
                foto:
                  type: string
                  format: binary
                  description: Imagen JPEG, PNG o WebP del tablero
      responses:
        '201':
          description: Lectura registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LecturaKm'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/KmInvalido'

  /vehiculos/{vehiculoId}/garantia:
    get:
      tags: [Garantía y campañas]
      summary: Garantía del vehículo
      description: |
        V2-M10.01 · Cada componente cubierto con su fecha y km límite contra el km actual del
        auto (el mismo del mantenimiento, V2-M05.02). La que vence primero va arriba. Por vencer
        a 60 días o a 1 000 km del límite; vencida en cuanto pasa la fecha o el km. Sin
        coberturas registradas responde 200 con `coberturas` vacío.
      parameters:
        - $ref: '#/components/parameters/VehiculoId'
      responses:
        '200':
          description: Garantía del vehículo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GarantiaVehiculo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /vehiculos/{vehiculoId}/campanas:
    get:
      tags: [Garantía y campañas]
      summary: Campañas de seguridad del vehículo
      description: |
        V2-M10.02 · Las campañas (recalls) que aplican al vehículo por modelo, año y, si la
        campaña lo trae, rango de VIN. Abiertas primero (la más grave arriba), luego agendadas
        y atendidas. Una agendada cuya cita se canceló vuelve a `ABIERTA`. Sin campañas
        responde 200 con la lista vacía. La app muestra la insignia en el garaje si alguna está
        `ABIERTA`.
      parameters:
        - $ref: '#/components/parameters/VehiculoId'
      responses:
        '200':
          description: Campañas del vehículo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampanaSeguridad'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /vehiculos/{vehiculoId}/campanas/{campanaId}/cita:
    post:
      tags: [Garantía y campañas]
      summary: Agendar la atención de una campaña
      description: |
        V2-M10.03 · Agenda una cita en la franja y el día elegidos (como `POST /citas`) con
        `motivo` `campana`, y la campaña pasa a `AGENDADA` con esa cita. Si la cita se cancela,
        la campaña vuelve a `ABIERTA`.
      parameters:
        - $ref: '#/components/parameters/VehiculoId'
        - name: campanaId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgendarCampana'
      responses:
        '201':
          description: Cita confirmada para atender la campaña
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cita'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            La campaña ya está agendada o atendida (`codigo` CAMPANA_NO_AGENDABLE), la franja ya no
            tiene cupo (`codigo` FRANJA_SIN_CUPO) o el vehículo ya tiene una cita ese día
            (`codigo` CITA_DUPLICADA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /catalogos-fiscales:
    get:
      tags: [Pagos y facturas]
      summary: Catálogos del SAT para los datos fiscales
      description: |
        V2-M08.05 · `c_RegimenFiscal` y `c_UsoCFDI` de CFDI 4.0 con la persona a la que aplica
        cada clave (`fisica`, `moral`) y los regímenes del receptor que acepta cada uso. El
        formulario de la app solo ofrece las combinaciones que el servidor acepta. Sin `CP01`
        (Pagos) ni `CN01` (Nómina), que no sirven para facturar un servicio.
      responses:
        '200':
          description: Catálogos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogoFiscal'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'

  /perfiles-fiscales:
    get:
      tags: [Pagos y facturas]
      summary: Mis datos fiscales
      description: V2-M08.05 · El predeterminado primero y luego del más viejo al más nuevo.
      responses:
        '200':
          description: Perfiles fiscales del cliente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PerfilFiscal'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
    post:
      tags: [Pagos y facturas]
      summary: Agregar datos fiscales
      description: |
        V2-M08.05 · RFC de 12 (moral) o 13 (física) caracteres con fecha real y dígito verificador
        del SAT (los genéricos no se aceptan), razón social, código postal de 5 dígitos, régimen y
        uso de CFDI del catálogo y válidos para el tipo de persona, el uso aceptado por el régimen y
        correo opcional. El RFC y la razón social se guardan en mayúsculas. El primero queda como
        predeterminado; otro lo es con `predeterminado: true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntradaPerfilFiscal'
      responses:
        '201':
          description: Perfil guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilFiscal'
        '400':
          $ref: '#/components/responses/DatosFiscalesInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'

  /perfiles-fiscales/{perfilId}:
    parameters:
      - name: perfilId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Pagos y facturas]
      summary: Ver un perfil fiscal
      description: V2-M08.05 · Uno ajeno responde 404.
      responses:
        '200':
          description: El perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilFiscal'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags: [Pagos y facturas]
      summary: Corregir datos fiscales
      description: |
        V2-M08.05 · Reemplaza los datos con las mismas reglas del alta. `predeterminado: true` lo
        vuelve el predeterminado; `false` o sin él no cambia cuál es. Uno ajeno responde 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntradaPerfilFiscal'
      responses:
        '200':
          description: Perfil corregido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilFiscal'
        '400':
          $ref: '#/components/responses/DatosFiscalesInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    delete:
      tags: [Pagos y facturas]
      summary: Borrar datos fiscales
      description: |
        V2-M08.05 · Si era el predeterminado, lo toma el más viejo de los que quedan. Uno ajeno
        responde 404.
      responses:
        '204':
          description: Borrado
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /ordenes/{ordenId}/pagos:
    parameters:
      - $ref: '#/components/parameters/OrdenId'
    post:
      tags: [Pagos y facturas]
      summary: Pagar una orden
      description: |
        V2-M08.02 y V2-M08.04 · Cobra con el procesador simulado una orden del taller lista para
        entrega o entregada. Con `tarjeta` se paga con una tarjeta de prueba nueva (token y
        vencimiento) y `guardarTarjeta` la guarda al quedar pagada; con `metodoPagoId`, con una
        guardada. El intento queda `PAGADO`, `FALLIDO` con `motivoFallo` o `PENDIENTE` con
        `requiereAutenticacion` si el banco simulado pide 3-D Secure (se responde en
        `POST /pagos/{pagoId}/autenticacion`; a los 15 minutos sin respuesta vence). Repetir la
        misma `Idempotency-Key` responde 200 con el mismo intento y no cobra otra vez; para
        reintentar un rechazo se usa una llave nueva. Al quedar pagada llega el evento
        `pago.confirmado`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoPago'
      responses:
        '200':
          description: El intento ya creado con esa llave
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pago'
        '201':
          description: Intento creado (pagado, fallido o esperando el 3-D Secure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pago'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            `ORDEN_NO_PAGABLE` (no viene del taller, aún no está lista, no tiene total o ya está
            pagada, también en caja) o `PAGO_EN_CURSO` (otro intento espera el 3-D Secure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /pedidos/{pedidoId}/pagos:
    parameters:
      - name: pedidoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [Tienda, Pagos y facturas]
      summary: Pagar un pedido de la tienda
      description: |
        V2-M14.04: Cobra el total del pedido con el procesador simulado, igual que
        `POST /ordenes/{ordenId}/pagos`: el mismo cuerpo, las mismas respuestas y el mismo `Pago`,
        con `pedidoId` lleno y `ordenId` nulo. El pedido tiene que estar `apartado` o `listo`, sin
        vencer, con total y sin pagar. El 3-D Secure se responde en
        `POST /pagos/{pagoId}/autenticacion`. Repetir la misma `Idempotency-Key` responde 200 con el
        mismo intento, y usarla con otra orden o con otro pedido es 400. Un pedido pagado ya no vence
        y no se cancela desde la app. No suma puntos de lealtad. Al quedar pagado llega el evento
        `pago.confirmado` con `pedidoId`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoPago'
      responses:
        '200':
          description: El intento ya creado con esa llave
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pago'
        '201':
          description: Intento creado (pagado, fallido o esperando el 3-D Secure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pago'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            `PEDIDO_NO_PAGABLE` (no está apartado ni listo, ya venció, no tiene total o ya está
            pagado) o `PAGO_EN_CURSO` (otro intento espera el 3-D Secure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /pagos:
    get:
      tags: [Pagos y facturas]
      summary: Mis pagos
      description: |
        V2-M08.07 y V2-M14.04: Del más nuevo al más viejo, con los fallidos. Trae los pagos de
        órdenes y los de pedidos de la tienda.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Pagos del cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaPagos'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'

  /pagos/{pagoId}:
    parameters:
      - name: pagoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Pagos y facturas]
      summary: Ver un pago
      description: V2-M08.02 y V2-M08.07 · Uno ajeno responde 404.
      responses:
        '200':
          description: El pago
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pago'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /pagos/{pagoId}/autenticacion:
    parameters:
      - name: pagoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [Pagos y facturas]
      summary: Responder el 3-D Secure simulado
      description: |
        V2-M08.02 y V2-M14.04: Lo que la persona respondió en la pantalla simulada de su banco,
        para el pago de una orden o de un pedido. Queda
        `PAGADO` o `FALLIDO` con `AUTENTICACION_FALLIDA` (o `AUTENTICACION_VENCIDA` si pasaron
        15 minutos).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutenticacionPago'
      responses:
        '200':
          description: El pago ya resuelto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pago'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`PAGO_NO_PENDIENTE`: el pago ya no espera el 3-D Secure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /metodos-pago:
