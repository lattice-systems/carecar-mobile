        cantidad:
          type: integer
        precio:
          type: number
        importe:
          type: number

    PaginaPedidos:
      type: object
      required: [contenido, pagina, tamano, totalElementos, totalPaginas]
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/Pedido'
        pagina:
          type: integer
        tamano:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer

    Valuacion:
      type: object
      required: [id, estado, creadaEn, vehiculoId, estimacion, fotos, puedeAgendar]
      properties:
        id:
          type: integer
          format: int64
        estado:
          $ref: '#/components/schemas/EstadoValuacion'
        creadaEn:
          type: string
          format: date-time
          description: En UTC
        vehiculoId:
          type: integer
          format: int64
        estimacion:
          $ref: '#/components/schemas/EstimacionTomaCuenta'
        fotos:
          type: array
          description: Solo las tomas ya subidas, en el orden de `TomaValuacion`
