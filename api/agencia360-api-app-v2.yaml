      summary: Mis tarjetas guardadas
      description: V2-M08.04 · La predeterminada primero. Sin número ni token.
      responses:
        '200':
          description: Tarjetas del cliente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetodoPago'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'

  /metodos-pago/{metodoPagoId}:
    parameters:
      - name: metodoPagoId
        in: path
