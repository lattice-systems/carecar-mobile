          nullable: true
        oferta:
          allOf:
            - $ref: '#/components/schemas/OfertaValuacion'
          nullable: true
        respondidaEn:
          type: string
          format: date-time
          nullable: true
          description: En UTC
        asesor:
          type: string
          nullable: true
          description: Nombre del vendedor del prospecto ligado, cuando ya lo hay

    PaginaValuaciones:
      type: object
      required: [contenido, pagina, tamano, totalElementos, totalPaginas]
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/Valuacion'
        pagina:
          type: integer
        tamano:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer

    AgendarInspeccion:
      type: object
      required: [franjaId, fecha]
      properties:
        franjaId:
          type: integer
          format: int64
        fecha:
          type: string
          format: date

    RespuestaOferta:
      type: object
      required: [aceptada, monto]
      properties:
        aceptada:
          type: boolean
        monto:
          type: number
          description: El monto de la oferta que el cliente está respondiendo

    ValorEstimado:
      type: object
      required: [vehiculoId, puntos]
      properties:
        vehiculoId:
          type: integer
          format: int64
        puntos:
          type: array
          items:
            $ref: '#/components/schemas/PuntoValorEstimado'

    PuntoValorEstimado:
      type: object
      required: [mes, estimacionTomaCuentaId, creadaEn, minimo, maximo, medio, km, estado]
      properties:
        mes:
          type: string
          pattern: '^\d{4}-\d{2}$'
          example: '2026-11'
        estimacionTomaCuentaId:
          type: integer
          format: int64
        creadaEn:
          type: string
          format: date-time
          description: En UTC
        minimo:
          type: number
        maximo:
          type: number
        medio:
          type: number
          description: Promedio de `minimo` y `maximo`, con 2 decimales. Es lo que se grafica.
        km:
          type: integer
        estado:
          $ref: '#/components/schemas/EstadoVehiculo'

    AvisoValuacionOferta:
      type: object
      description: V2-M26.04 · `data` del evento `valuacion.oferta`
      required: [valuacionId, vehiculoId, vigenciaHasta]
      properties:
        valuacionId:
          type: integer
          format: int64
        vehiculoId:
          type: integer
          format: int64
        vigenciaHasta:
          type: string
          format: date

    AvisoOrden:
      type: object
      description: V2-T05.08 · `data` del evento `orden`
      required: [ordenId, vehiculoId, estatus, motivo]
      properties:
        ordenId:
          type: integer
          format: int64
        vehiculoId:
          type: integer
          format: int64
        estatus:
          type: string
          enum: [RECIBIDO, EN_PROCESO, TERMINADO, ENTREGADO]
        etapa:
          allOf:
            - $ref: '#/components/schemas/EtapaTaller'
          nullable: true
          description: V2-M04.03 · Nula si la orden se registró ya hecha, sin línea de tiempo
        motivo:
          type: string
          description: |
            V2-M04.03 · Qué cambió: `REGISTRO` (servicio registrado ya hecho), `APERTURA`,
            `ETAPA`, `INSPECCION` (punto o evidencia), `ADICIONAL` (propuesto), `RESPUESTA` (del
            cliente) o `RENGLON` (cargado al ticket).
          enum: [REGISTRO, APERTURA, ETAPA, INSPECCION, ADICIONAL, RESPUESTA, RENGLON]

    AvisoAsistencia:
      type: object
      description: V2-M11.04 · `data` del evento `asistencia.estado`
      required: [solicitudId, estado]
      properties:
        solicitudId:
          type: integer
          format: int64
        estado:
          $ref: '#/components/schemas/EstadoAsistencia'

    GarantiaVehiculo:
      type: object
      description: V2-M10.01 · La garantía de un vehículo
      required: [vehiculoId, coberturas]
      properties:
        vehiculoId:
          type: integer
          format: int64
        kmActual:
          type: integer
          nullable: true
          description: El km actual del auto (V2-M05.02); nulo si no se conoce.
        coberturas:
          type: array
          items:
            $ref: '#/components/schemas/CoberturaGarantia'

    CoberturaGarantia:
      type: object
      description: V2-M10.01 · Lo que cubre la garantía de un componente y hasta cuándo
      required: [id, componente, iniciaEn, venceEn, diasRestantes, consumo, estado, limite]
      properties:
        id:
          type: integer
          format: int64
        componente:
          type: string
          example: Motor y transmisión
        descripcion:
          type: string
          nullable: true
        iniciaEn:
          type: string
          format: date
        venceEn:
          type: string
          format: date
        kmLimite:
          type: integer
          nullable: true
          example: 60000
        diasRestantes:
          type: integer
          description: Días hasta `venceEn`; 0 si ya pasó.
        kmRestantes:
          type: integer
          nullable: true
          description: Km hasta `kmLimite`; nulo si no tiene km límite o no se conoce el km del auto.
        consumo:
          type: integer
          minimum: 0
          maximum: 100
          description: Porcentaje usado del tiempo o del km, lo que vaya más adelante.
        estado:
          type: string
          enum: [VIGENTE, POR_VENCER, VENCIDA]
        limite:
          type: string
          enum: [fecha, km]
          description: El límite que se alcanza primero, o el que la venció.

    CampanaSeguridad:
      type: object
      description: V2-M10.02 · Una campaña de seguridad para un vehículo del cliente
      required: [id, codigo, titulo, descripcion, queHacer, gravedad, estado, publicadaEn]
      properties:
        id:
          type: integer
          format: int64
          description: Id de la campaña; el mismo para todos los vehículos a los que aplica.
        codigo:
          type: string
          example: RC-24-017
        titulo:
          type: string
          example: Bolsa de aire del conductor
        descripcion:
          type: string
        queHacer:
          type: string
          example: Agenda una revisión; el cambio no tiene costo.
        gravedad:
          type: string
          enum: [BAJA, MEDIA, ALTA, CRITICA]
        estado:
          type: string
          enum: [ABIERTA, AGENDADA, ATENDIDA]
        citaId:
          type: integer
          format: int64
          nullable: true
          description: La cita que la atiende; nula si aún no se agenda.
        publicadaEn:
          type: string
          format: date-time

    AgendarCampana:
      type: object
      description: V2-M10.03 · Franja y día para atender la campaña
      required: [franjaId, fecha]
      properties:
        franjaId:
          type: integer
          format: int64
          description: Id de `franja_horario`; debe ser del día de `fecha`.
        fecha:
          type: string
          format: date

    AvisoCampanaNueva:
      type: object
      description: V2-M10.04 · `data` del evento `campana.nueva`
      required: [vehiculoId, campanaId, codigo, titulo, gravedad, critica]
      properties:
        vehiculoId:
          type: integer
          format: int64
        campanaId:
          type: integer
          format: int64
        codigo:
          type: string
        titulo:
          type: string
        gravedad:
          type: string
          enum: [BAJA, MEDIA, ALTA, CRITICA]
        critica:
          type: boolean
          description: El push no se puede silenciar si es `true`.

    AvisoGarantiaPorVencer:
      type: object
      description: V2-M10.05 · `data` del evento `garantia.por_vencer`
      required: [vehiculoId, garantiaId, componente, venceEn, diasRestantes, motivo]
      properties:
        vehiculoId:
          type: integer
          format: int64
        garantiaId:
          type: integer
          format: int64
        componente:
          type: string
        venceEn:
          type: string
          format: date
        diasRestantes:
          type: integer
        kmRestantes:
          type: integer
          description: Solo si la cobertura tiene km límite y se conoce el km del auto.
        motivo:
          type: string
          enum: [dias_60, dias_15, km_1000]

    NivelLealtad:
      type: string
      enum: [BRONCE, PLATA, ORO]
    ResumenLealtad:
      type: object
      required: [saldo, nivel, ganados, puntosParaSiguiente, codigoReferido]
      properties:
        saldo:
          type: integer
          format: int64
          example: 1240
        nivel:
          $ref: '#/components/schemas/NivelLealtad'
        ganados:
          type: integer
          format: int64
          description: Puntos ganados en los últimos 12 meses; deciden el nivel
          example: 1640
        siguienteNivel:
          allOf:
            - $ref: '#/components/schemas/NivelLealtad'
          nullable: true
          description: null si ya está en Oro
        puntosParaSiguiente:
          type: integer
          format: int64
          description: Los que le faltan ganar; 0 en Oro
          example: 2360
        codigoReferido:
          type: string
          example: CC0000Z
    MovimientoPuntos:
      type: object
      required: [id, puntos, motivo, creadoEn]
      properties:
        id:
          type: integer
          format: int64
        puntos:
          type: integer
          description: Positivo si ganó, negativo si gastó
          example: 165
        motivo:
          type: string
          enum: [SERVICIO, CANJE, DEVOLUCION_CANJE, REFERIDO, AJUSTE]
        referenciaTipo:
          type: string
          nullable: true
          enum: [ORDEN, CANJE, REFERIDO]
          description: De dónde salió; null en un ajuste manual
        referenciaId:
          type: integer
          format: int64
          nullable: true
        creadoEn:
          type: string
          format: date-time
    PaginaMovimientosPuntos:
      type: object
      required: [contenido, pagina, tamano, totalElementos, totalPaginas]
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/MovimientoPuntos'
        pagina:
          type: integer
        tamano:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
    Recompensa:
      type: object
      required: [id, nombre, puntos]
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
          example: Lavado exprés
        descripcion:
          type: string
          nullable: true
        puntos:
          type: integer
          example: 300
        existencia:
          type: integer
          nullable: true
          description: null si no tiene límite
    CanjearRecompensa:
      type: object
      required: [recompensaId]
      properties:
        recompensaId:
          type: integer
          format: int64
    Canje:
      type: object
      required: [id, codigo, recompensa, puntos, estado, venceEn, creadoEn]
      properties:
        id:
          type: integer
          format: int64
        codigo:
          type: string
          minLength: 8
          maxLength: 8
          description: Lo que la app muestra como QR y el personal usa en la agencia
          example: K7XQ2MPA
        recompensa:
          type: string
          example: Lavado exprés
        puntos:
          type: integer
          example: 300
        estado:
          type: string
          enum: [VIGENTE, USADO, VENCIDO]
        venceEn:
          type: string
          format: date-time
        usadoEn:
          type: string
          format: date-time
          nullable: true
        creadoEn:
          type: string
          format: date-time
    ReferirAmigo:
      type: object
      required: [nombre, consentimiento]
      description: Necesita `telefono` o `correo`
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
          example: Luis Pérez
        telefono:
          type: string
          maxLength: 20
          nullable: true
          description: 10 dígitos; se aceptan espacios, guiones y el prefijo +52
          example: '4421234567'
        correo:
          type: string
          format: email
          maxLength: 254
          nullable: true
        consentimiento:
          type: boolean
          description: El amigo aceptó que la agencia lo contacte; debe ser true
    Referido:
      type: object
      required: [id, nombre, estado, puntos, creadoEn]
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
          example: Luis Pérez
        estado:
          type: string
          enum: [REGISTRADO, EN_SEGUIMIENTO, COMPRO, DESCARTADO]
        puntos:
          type: integer
          description: Los que ganó el cliente si compró; 0 si no
          example: 500
        creadoEn:
          type: string
          format: date-time
        recompensadoEn:
          type: string
          format: date-time
          nullable: true
    AvisoPagoConfirmado:
      type: object
      description: |
        Evento SSE `pago.confirmado` (V2-M08.02 y V2-M14.04). Exactamente uno de `ordenId` y
        `pedidoId` viene lleno.
      required: [pagoId, estado]
      properties:
        pagoId:
          type: integer
          format: int64
        ordenId:
          type: integer
          format: int64
          nullable: true
        pedidoId:
          type: integer
          format: int64
          nullable: true
        estado:
          type: string
          enum: [PAGADO]
    Pago:
      type: object
      description: |
        V2-M08.02, V2-M08.07 y V2-M14.04: Un intento de pagar una orden o un pedido de la
        tienda. Exactamente uno de `ordenId` y `pedidoId` viene lleno. Nunca trae el número de la
        tarjeta, solo la marca y los últimos 4.
      required: [id, ordenId, pedidoId, vehiculoId, monto, moneda, medio, estado,
        requiereAutenticacion, referencia, simulado, creadoEn]
      properties:
        id:
          type: integer
          format: int64
        ordenId:
          type: integer
          format: int64
          nullable: true
          description: |
            La orden de servicio, con su ticket en `GET /servicios/{ordenId}`. Nulo en el pago de un
            pedido.
        pedidoId:
          type: integer
          format: int64
          nullable: true
          description: |
            V2-M14.04. El pedido de la tienda, que se ve en `GET /tienda/pedidos/{pedidoId}`. Nulo en
            el pago de una orden.
        vehiculoId:
          type: integer
          format: int64
          nullable: true
          description: El vehículo de la orden. Nulo en el pago de un pedido.
        monto:
          type: number
          format: double
          description: Total de la orden o del pedido, con IVA incluido
          example: 1650.0
        moneda:
          type: string
          enum: [MXN]
        medio:
          type: string
          enum: [TARJETA, APPLE_PAY, GOOGLE_PAY, CAJA]
        marca:
          type: string
          nullable: true
          enum: [VISA, MASTERCARD]
        ultimos4:
          type: string
          nullable: true
          pattern: '^[0-9]{4}$'
          example: '4242'
        tipoTarjeta:
          type: string
          nullable: true
          enum: [CREDITO, DEBITO]
        estado:
          type: string
          enum: [PENDIENTE, PAGADO, FALLIDO, REEMBOLSADO]
        motivoFallo:
          type: string
          nullable: true
          enum: [FONDOS_INSUFICIENTES, AUTENTICACION_FALLIDA, AUTENTICACION_VENCIDA, PAGADA_EN_CAJA]
          description: Solo en `FALLIDO`
        requiereAutenticacion:
          type: boolean
          description: Sigue `PENDIENTE` porque el banco simulado pide 3-D Secure
        referencia:
          type: string
          description: Folio del procesador simulado (`sim_pi_…`) o de caja
          example: sim_pi_3f9a1c0b7e2d4a6c8b1e0f2a
        simulado:
          type: boolean
          description: Lo cobró el procesador simulado; `false` si se pagó en caja
        metodoPagoId:
          type: integer
          format: int64
          nullable: true
          description: La tarjeta guardada con que se pagó o que se guardó al pagar
        perfilFiscalId:
          type: integer
          format: int64
          nullable: true
        pagadoEn:
          type: string
          format: date-time
          nullable: true
        creadoEn:
          type: string
          format: date-time
    PaginaPagos:
      type: object
      required: [contenido, pagina, tamano, totalElementos, totalPaginas]
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/Pago'
        pagina:
          type: integer
        tamano:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
    NuevoPago:
      type: object
      description: |
        V2-M08.02 · Una tarjeta de prueba nueva (`tarjeta`) o una guardada (`metodoPagoId`), no
        las dos. Nunca el número ni el CVV.
      properties:
        tarjeta:
          type: object
          required: [token, mesVence, anioVence]
          properties:
            token:
              type: string
              maxLength: 64
              example: tok_sim_visa
            mesVence:
              type: integer
              minimum: 1
              maximum: 12
            anioVence:
              type: integer
              example: 2028
        metodoPagoId:
          type: integer
          format: int64
        guardarTarjeta:
          type: boolean
          default: false
          description: Guarda la tarjeta nueva al quedar pagado (hasta 10 por cliente)
        perfilFiscalId:
          type: integer
          format: int64
          nullable: true
          description: Los datos fiscales para la factura (V2-M08.06)
    AutenticacionPago:
      type: object
      required: [confirmada]
      properties:
        confirmada:
          type: boolean
          description: '`false` si la persona canceló en la pantalla de su banco'
    MetodoPago:
      type: object
      description: V2-M08.04 · Una tarjeta guardada, sin número ni token
      required: [id, marca, ultimos4, tipo, mesVence, anioVence, vencida, predeterminado, creadoEn]
      properties:
        id:
          type: integer
          format: int64
        marca:
          type: string
          enum: [VISA, MASTERCARD]
        ultimos4:
          type: string
          pattern: '^[0-9]{4}$'
        tipo:
          type: string
          enum: [CREDITO, DEBITO]
        mesVence:
          type: integer
        anioVence:
          type: integer
        vencida:
          type: boolean
        predeterminado:
          type: boolean
        creadoEn:
          type: string
          format: date-time
    AvisoPuntosMovidos:
      type: object
      description: Evento SSE `puntos.movidos` (V2-M12.02)
      required: [puntos, motivo, saldo]
      properties:
        puntos:
          type: integer
          example: 165
        motivo:
          type: string
          enum: [SERVICIO, CANJE, DEVOLUCION_CANJE, REFERIDO, AJUSTE]
        saldo:
          type: integer
          format: int64
          example: 1405
    AvisoMantenimientoRecordatorio:
      type: object
      description: V2-M05.05 · `data` del evento `mantenimiento.recordatorio`
      required: [vehiculoId, servicioId, nombre, faltanKm, faltanDias, motivo]
      properties:
        vehiculoId:
          type: integer
          format: int64
        servicioId:
          type: integer
          format: int64
        nombre:
          type: string
          example: Servicio de 20 000 km
        faltanKm:
          type: integer
          description: Puede ser negativo si el servicio ya se pasó.
        faltanDias:
          type: integer
        motivo:
          type: string
          enum: [km, tiempo]

    AvisoTrasladoEstado:
      type: object
      description: V2-M17.03 · `data` del evento `traslado.estado`
      required: [trasladoId, citaId, tipo, estado]
      properties:
        trasladoId:
          type: integer
          format: int64
        citaId:
          type: integer
          format: int64
        tipo:
          type: string
          enum: [recoger, entregar]
        estado:
          $ref: '#/components/schemas/EstadoTraslado'

    AvisoTrasladoUbicacion:
      type: object
      description: V2-M17.03 · `data` del evento `traslado.ubicacion`
      required: [trasladoId, lat, lng, actualizadaEn]
      properties:
        trasladoId:
          type: integer
          format: int64
        lat:
          type: number
        lng:
          type: number
        actualizadaEn:
          type: string
          format: date-time
          description: En UTC

    TipoAsistencia:
      type: string
      description: Se acepta sin importar mayúsculas y siempre se devuelve en minúsculas.
      enum: [llanta, bateria, choque, sin_gasolina, otro]

    EstadoAsistencia:
      type: string
      enum: [recibida, en_camino, atendida, cancelada]

    NuevaSolicitudAsistencia:
      type: object
      required: [vehiculoId, tipo]
      properties:
        vehiculoId:
          type: integer
          format: int64
        tipo:
          $ref: '#/components/schemas/TipoAsistencia'
        lat:
          type: number
          minimum: -90
          maximum: 90
          nullable: true
        lng:
          type: number
          minimum: -180
          maximum: 180
          nullable: true
        comentario:
          type: string
          maxLength: 500
          nullable: true

    SolicitudAsistencia:
      type: object
      required: [id, vehiculoId, tipo, estado, creadaEn]
      properties:
        id:
          type: integer
          format: int64
        vehiculoId:
          type: integer
          format: int64
        tipo:
          $ref: '#/components/schemas/TipoAsistencia'
        lat:
          type: number
          nullable: true
          description: Nula si no se compartió o si la solicitud ya se cerró (V2-M11.04)
        lng:
          type: number
          nullable: true
          description: Nula si no se compartió o si la solicitud ya se cerró (V2-M11.04)
        comentario:
          type: string
          nullable: true
        estado:
          $ref: '#/components/schemas/EstadoAsistencia'
        creadaEn:
          type: string
          format: date-time
          description: En UTC

    NuevaDireccion:
      type: object
      required: [alias, calle, colonia, cp, ciudad, lat, lng]
      properties:
        alias:
          type: string
          maxLength: 40
          example: Casa
        calle:
          type: string
          maxLength: 120
        colonia:
          type: string
          maxLength: 80
        cp:
          type: string
          pattern: '^[0-9]{5}$'
        ciudad:
          type: string
          maxLength: 80
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180

    TipoPersona:
      type: string
      description: Lo dice el largo del RFC; 13 es persona física y 12 moral.
      enum: [FISICA, MORAL]
    RegimenFiscal:
      type: object
      required: [clave, descripcion, fisica, moral]
      properties:
        clave:
          type: string
          example: '612'
        descripcion:
          type: string
          example: Personas Físicas con Actividades Empresariales y Profesionales
        fisica:
          type: boolean
          description: Aplica a persona física
        moral:
          type: boolean
          description: Aplica a persona moral
    UsoCfdi:
      type: object
      required: [clave, descripcion, fisica, moral, regimenes]
      properties:
        clave:
          type: string
          example: G03
        descripcion:
          type: string
          example: Gastos en general
        fisica:
          type: boolean
        moral:
          type: boolean
        regimenes:
          type: array
          description: Claves de régimen del receptor que aceptan este uso, ordenadas
          items:
            type: string
    CatalogoFiscal:
      type: object
      required: [regimenes, usosCfdi]
      properties:
        regimenes:
          type: array
          items:
            $ref: '#/components/schemas/RegimenFiscal'
        usosCfdi:
          type: array
          items:
            $ref: '#/components/schemas/UsoCfdi'
    PerfilFiscal:
      type: object
      required: [id, rfc, tipoPersona, razonSocial, regimenFiscal, codigoPostal, usoCfdi, predeterminado, creadoEn]
      properties:
        id:
          type: integer
          format: int64
        rfc:
          type: string
          example: GODE561231GR8
        tipoPersona:
          $ref: '#/components/schemas/TipoPersona'
        razonSocial:
          type: string
          description: En mayúsculas, como en la constancia de situación fiscal
          example: DOLORES GÓMEZ
        regimenFiscal:
          type: string
          example: '612'
        codigoPostal:
          type: string
          description: Del domicilio fiscal
          example: '76000'
        usoCfdi:
          type: string
          example: G03
        correo:
          type: string
          format: email
          nullable: true
          description: Adonde mandar la factura; opcional
        predeterminado:
          type: boolean
        creadoEn:
          type: string
          format: date-time
    EntradaPerfilFiscal:
      type: object
      description: Los campos se revisan en el servidor; los que fallan vuelven en `campos`.
      properties:
        rfc:
          type: string
          maxLength: 13
        razonSocial:
          type: string
          maxLength: 254
        regimenFiscal:
          type: string
          maxLength: 3
        codigoPostal:
          type: string
          maxLength: 5
        usoCfdi:
          type: string
          maxLength: 4
        correo:
          type: string
          nullable: true
          maxLength: 254
        predeterminado:
          type: boolean
          nullable: true
          description: "`true` lo vuelve el predeterminado; `false` o sin él no cambia cuál es"
    Direccion:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
        - $ref: '#/components/schemas/NuevaDireccion'

    FranjaRecoleccion:
      type: object
      required: [inicio, fin]
      properties:
        inicio:
          type: string
          example: '07:00'
        fin:
          type: string
          example: '09:00'

    CotizacionRecoleccion:
      type: object
      required: [direccionId, fecha, costoPorTraslado, costoTotal, recoleccion, entrega]
      properties:
        direccionId:
          type: integer
          format: int64
        fecha:
          type: string
          format: date
        costoPorTraslado:
          type: number
          description: Pesos, a 2 decimales
        costoTotal:
          type: number
          description: Los dos traslados, recoger y entregar
        recoleccion:
          $ref: '#/components/schemas/FranjaRecoleccion'
        entrega:
          $ref: '#/components/schemas/FranjaRecoleccion'

    EstadoTraslado:
      type: string
      description: |
        Nace `programado`. Recoger: `programado` → `en_camino` → `recogido` → `en_taller`.
        Entregar: `programado` → `de_regreso` → `entregado`. `cancelado` solo desde `programado`,
        cuando se cancela la cita (V2-M17.03 y V2-M17.05).
      enum: [programado, en_camino, recogido, en_taller, de_regreso, entregado, cancelado]

    Traslado:
      type: object
      required: [id, tipo, estado, costo, fecha, ventanaInicio, ventanaFin]
      properties:
        id:
          type: integer
          format: int64
        tipo:
          type: string
          enum: [recoger, entregar]
        estado:
          $ref: '#/components/schemas/EstadoTraslado'
        costo:
          type: number
        fecha:
          type: string
          format: date
        ventanaInicio:
          type: string
        ventanaFin:
          type: string

    UbicacionChofer:
      type: object
      required: [lat, lng, actualizadaEn]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        actualizadaEn:
          type: string
          format: date-time
          description: En UTC

    SeguimientoTraslado:
      type: object
      description: V2-M17.03 · El traslado con su estado y la ubicación del chofer
      required: [id, citaId, tipo, estado, costo, fecha, ventanaInicio, ventanaFin]
      properties:
        id:
          type: integer
          format: int64
        citaId:
          type: integer
          format: int64
        tipo:
          type: string
          enum: [recoger, entregar]
        estado:
          $ref: '#/components/schemas/EstadoTraslado'
        costo:
          type: number
        fecha:
          type: string
          format: date
        ventanaInicio:
          type: string
        ventanaFin:
          type: string
        ubicacionChofer:
          allOf:
            - $ref: '#/components/schemas/UbicacionChofer'
          description: Solo en `en_camino` o `de_regreso` y con al menos un reporte; si no, se omite

    GasolinaChecklist:
      type: string
      enum: [vacio, un_cuarto, medio, tres_cuartos, lleno]

    ChecklistTraslado:
      type: object
      description: V2-M17.04 · Checklist que llenó el chofer al recoger o entregar
      required: [trasladoId, km, gasolina, fotos, registradoEn]
      properties:
        trasladoId:
          type: integer
          format: int64
        km:
          type: integer
          minimum: 1
        gasolina:
          $ref: '#/components/schemas/GasolinaChecklist'
        notas:
          type: string
          maxLength: 500
          description: Se omite si no hay
        fotos:
          type: array
          description: URL temporales firmadas, vencen a los 15 minutos
          items:
            type: string
        firmaUrl:
          type: string
          description: URL temporal firmada de la firma; se omite si no hay
        registradoEn:
          type: string
          format: date-time
          description: En UTC

    RecoleccionCita:
      type: object
      required: [direccionId, costoTotal, traslados]
      properties:
        direccionId:
          type: integer
          format: int64
        costoTotal:
          type: number
        traslados:
          type: array
          description: El de recoger y el de entregar
          items:
            $ref: '#/components/schemas/Traslado'

    EtapaTaller:
      type: string
      description: |
        V2-M04.02 · Etapas de la orden en el orden en que pasan. El taller puede saltar una
        (sin lavado, por ejemplo), nunca volver.
      enum: [RECIBIDO, DIAGNOSTICO, ESPERANDO_APROBACION, EN_REPARACION, CONTROL_DE_CALIDAD,
        LAVADO, LISTO_PARA_ENTREGA, ENTREGADO]

    OrdenEnCurso:
      type: object
      description: V2-M04.01 · Orden sin entregar, para la tarjeta de Inicio
      required: [id, vehiculoId, vehiculo, etapa, estatus, avance, adicionalesPendientes]
      properties:
        id:
          type: integer
          format: int64
        vehiculoId:
          type: integer
          format: int64
        vehiculo:
          type: string
          example: Nissan March 2026
        etapa:
          $ref: '#/components/schemas/EtapaTaller'
        estatus:
          type: string
          enum: [RECIBIDO, EN_PROCESO, TERMINADO, ENTREGADO]
        entregaEstimada:
          type: string
          nullable: true
          example: '2026-11-24T18:00:00'
          description: En hora de la agencia; nula si aún no se estima
        asesor:
          type: string
          nullable: true
          example: Laura Méndez
        avance:
          type: integer
          minimum: 0
          maximum: 100
          description: Según la etapa
        adicionalesPendientes:
          type: integer
          minimum: 0
          description: Trabajos adicionales que esperan la respuesta del cliente
        totalEstimado:
          type: number
          format: double
          description: V2-M04.06 · Con IVA; el de la orden más los adicionales aprobados
        horarioEntrega:
          allOf:
            - $ref: '#/components/schemas/HorarioEntrega'
          nullable: true
          description: V2-M04.06 · Solo cuando está lista para entrega

    HorarioEntrega:
      type: object
      description: |
        V2-M04.06 · Cuándo recoger el auto: el primer día desde hoy con horario del taller, de la
        primera hora a la última. Hoy cuenta solo si aún no cierra. Hora local de la agencia.
      required: [fecha, desde, hasta]
      properties:
        fecha:
          type: string
          format: date
          example: '2026-11-24'
        desde:
          type: string
          example: '09:00'
        hasta:
          type: string
          example: '17:00'

    OrdenEnVivo:
      type: object
      description: |
        V2-M04.02, V2-M04.04 a V2-M04.07 · La orden en el taller. Los montos traen el IVA
        incluido; `totalEstimado` es `totalOrden` más los adicionales aprobados que aún no se
        suman a la orden (se suman como renglones al quedar lista para entrega).
      required: [id, vehiculoId, vehiculo, estatus, etapa, avance, etapas, inspeccion, evidencias,
        adicionales, totalOrden, totalAdicionalesAprobados, totalAdicionalesPendientes, totalEstimado]
      properties:
        id:
          type: integer
          format: int64
        vehiculoId:
          type: integer
          format: int64
        vehiculo:
          type: string
          example: Nissan March 2026
        estatus:
          type: string
          enum: [RECIBIDO, EN_PROCESO, TERMINADO, ENTREGADO]
        etapa:
          $ref: '#/components/schemas/EtapaTaller'
        entregaEstimada:
          type: string
          nullable: true
          example: '2026-11-24T18:00:00'
          description: En hora de la agencia; nula si aún no se estima
        asesor:
          type: string
          nullable: true
        avance:
          type: integer
          minimum: 0
          maximum: 100
        etapas:
          type: array
          description: Solo las que ya empezaron, en orden; la última es la actual
          items:
            $ref: '#/components/schemas/PasoEtapa'
        inspeccion:
          type: array
          items:
            $ref: '#/components/schemas/PuntoInspeccion'
        evidencias:
          type: array
          description: Fotos y videos de la orden que no son de un punto revisado
          items:
            $ref: '#/components/schemas/Evidencia'
        adicionales:
          type: array
          items:
            $ref: '#/components/schemas/TrabajoAdicional'
        totalOrden:
          type: number
          format: double
        totalAdicionalesAprobados:
          type: number
          format: double
        totalAdicionalesPendientes:
          type: number
          format: double
        totalEstimado:
          type: number
          format: double
        horarioEntrega:
          allOf:
            - $ref: '#/components/schemas/HorarioEntrega'
          nullable: true
          description: V2-M04.06 · Solo cuando está lista para entrega

    PasoEtapa:
      type: object
      required: [etapa, inicio]
      properties:
        etapa:
          $ref: '#/components/schemas/EtapaTaller'
        inicio:
          type: string
          example: '2026-11-24T09:30:00'
          description: En hora de la agencia
        fin:
          type: string
          nullable: true
          description: En hora de la agencia; nula mientras siga en curso
        nota:
          type: string
          nullable: true
          maxLength: 300

    PuntoInspeccion:
      type: object
      description: V2-M04.04 · Un punto revisado con su semáforo
      required: [id, punto, resultado, evidencias]
      properties:
        id:
          type: integer
          format: int64
        punto:
          type: string
          example: Frenos
        resultado:
          type: string
          enum: [VERDE, AMARILLO, ROJO]
        comentario:
          type: string
          nullable: true
          example: Balatas al 10 %
        evidencias:
          type: array
          items:
            $ref: '#/components/schemas/Evidencia'

    Evidencia:
      type: object
      required: [id, tipo, url]
      properties:
        id:
          type: integer
          format: int64
        tipo:
          type: string
          enum: [FOTO, VIDEO]
        url:
          type: string
          description: |
            URL temporal firmada fuera de `/api/v1/app` (`/api/v1/archivos/...`), sin token. Vence
            a los 15 minutos. Foto JPEG, PNG o WebP; video MP4.
          example: /api/v1/archivos/evidencias/0f8c2b6e-2f6d-4c1e-9c2a-1b2c3d4e5f60?expira=1764000000&firma=abc

    TrabajoAdicional:
      type: object
      description: V2-M04.05 · Trabajo que el taller propone además de lo acordado
      required: [id, concepto, manoDeObra, refacciones, total, estado]
      properties:
        id:
          type: integer
          format: int64
        concepto:
          type: string
          example: Cambio de balatas delanteras
        manoDeObra:
          type: number
          format: double
        refacciones:
          type: number
          format: double
        total:
          type: number
          format: double
          description: Mano de obra más refacciones, con IVA incluido
        estado:
          type: string
          enum: [PENDIENTE, APROBADO, RECHAZADO]
        respondidoEn:
          type: string
          nullable: true
          description: En hora de la agencia; nula mientras esté pendiente

    RespuestaAdicional:
      type: object
      required: [aprobado, firma]
      properties:
        aprobado:
          type: boolean
        firma:
          type: string
          format: byte
          description: La firma en pantalla como PNG en Base64, de 1 MB como máximo

    Problema:
      type: object
      description: Formato de error del backend (ApiError en shared/exception).
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
          description: En UTC
        status:
          type: integer
          example: 409
        error:
          type: string
          example: Conflict
        message:
          type: string
          example: La franja ya no tiene cupo
        codigo:
          type: string
          nullable: true
          description: |
            Causa del error, para que la app decida sin leer el texto. Puede no venir.
          enum:
            - CREDENCIALES_INVALIDAS
            - CUENTA_DESACTIVADA
            - DEMASIADOS_INTENTOS
            - CODIGO_INVALIDO
            - DATOS_INVALIDOS
            - FRANJA_SIN_CUPO
            - FUERA_DE_PLAZO
            - CITA_NO_CANCELABLE
            - SIN_PARAMETROS_DE_VALUACION
            - CITA_DUPLICADA
            - CITA_NO_REPROGRAMABLE
            - CITA_CANCELADA
            - WALLET_NO_CONFIGURADO
            - SOLICITUD_ABIERTA
            - FUERA_DE_COBERTURA
            - DIRECCION_EN_USO
            - ASISTENTE_SIN_MANUAL
            - ASISTENTE_LIMITE
            - ASISTENTE_NO_DISPONIBLE
            - ORDEN_CERRADA
            - ADICIONAL_YA_RESPONDIDO
            - KM_INVALIDO
            - TRANSICION_INVALIDA
            - ESTRENO_SIN_PRECIO
            - ESTRENO_DUPLICADA
            - AVISO_NO_VIGENTE
            - CAMPANA_NO_AGENDABLE
            - SALDO_INSUFICIENTE
            - RECOMPENSA_AGOTADA
            - REFERIDO_DUPLICADO
            - LIMITE_REFERIDOS
            - VALUACION_SIN_VEHICULO
            - VALUACION_CERRADA
            - VALUACION_NO_AGENDABLE
            - OFERTA_VENCIDA
            - OFERTA_NO_DISPONIBLE
            - SIN_EXISTENCIA
            - CITA_NO_DISPONIBLE
            - LIMITE_APARTADOS
            - PEDIDO_NO_CANCELABLE
            - PEDIDO_NO_MODIFICABLE
            - PRODUCTO_INCOMPATIBLE
            - DATOS_FISCALES_INVALIDOS
            - ORDEN_NO_PAGABLE
            - PAGO_EN_CURSO
            - PAGO_NO_PENDIENTE
            - PEDIDO_NO_PAGABLE
            - PEDIDO_PAGADO
          example: FRANJA_SIN_CUPO
        campos:
          type: object
          description: |
            Qué está mal en cada campo de la petición (nombre del campo → por qué). Solo viene en
            errores que lo explican por campo, como DATOS_FISCALES_INVALIDOS.
          additionalProperties:
            type: string
        path:
          type: string
          example: /api/v1/app/citas
