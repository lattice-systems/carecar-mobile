        schema:
          type: integer
          format: int64
    delete:
      tags: [Pagos y facturas]
      summary: Borrar una tarjeta guardada
      description: |
        V2-M08.04 · Si era la predeterminada, lo es la más vieja de las que quedan. Los pagos
        hechos con ella se conservan. Una ajena responde 404.
      responses:
        '204':
