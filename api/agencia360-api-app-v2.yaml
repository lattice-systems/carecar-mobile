  /lealtad:
    get:
      tags: [Lealtad]
      summary: Mis puntos y nivel
      description: |
        V2-M12.01 · El saldo es la suma de los movimientos del cliente. El nivel sale de los puntos
        **ganados** en los últimos 12 meses (servicios, referidos y ajustes) con las reglas del
        servidor (`app.lealtad.*`; hoy Plata desde 1 500 y Oro desde 4 000). `siguienteNivel` es
        `null` en Oro. Un cliente sin movimientos responde 0 en `BRONCE`. También trae el código
        del cliente para referir amigos (V2-M12.04).
      responses:
        '200':
          description: Resumen de lealtad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenLealtad'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'

  /lealtad/movimientos:
    get:
      tags: [Lealtad]
      summary: Mis movimientos de puntos
      description: |
        V2-M12.05 · Del más reciente al más viejo. La suma de todos es el saldo de `GET /lealtad`.
        Los puntos de un servicio (V2-M12.02) llegan al entregarse la orden: un punto por cada
        $10 del total, una sola vez por orden.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Página de movimientos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaMovimientosPuntos'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'

  /lealtad/recompensas:
    get:
      tags: [Lealtad]
      summary: Recompensas
      description: V2-M12.03 · Las activas, de la más barata a la más cara.
      responses:
        '200':
          description: Recompensas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recompensa'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'

  /lealtad/canjes:
    get:
      tags: [Lealtad]
      summary: Mis canjes
      description: V2-M12.03 · Del más nuevo al más viejo, con su código y estado.
      responses:
        '200':
          description: Canjes del cliente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Canje'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
    post:
      tags: [Lealtad]
      summary: Canjear una recompensa
      description: |
        V2-M12.03 · Descuenta los puntos de la recompensa y crea un código de 8 caracteres que la
        app muestra como QR, vigente 30 días. Dos canjes a la vez nunca dejan el saldo negativo.
        Si vence sin usarse, sus puntos regresan con un movimiento `DEVOLUCION_CANJE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanjearRecompensa'
      responses:
        '201':
          description: Canje creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Canje'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            No alcanzan los puntos (`codigo` SALDO_INSUFICIENTE) o la recompensa se agotó
            (`codigo` RECOMPENSA_AGOTADA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /lealtad/referidos:
    get:
      tags: [Lealtad]
      summary: Mis referidos
      description: |
        V2-M12.04 · Del más nuevo al más viejo. `EN_SEGUIMIENTO` cuando ya es prospecto de un
        vendedor, `COMPRO` cuando su venta se finalizó (el cliente ganó sus puntos) y
        `DESCARTADO` si el prospecto se cerró sin venta.
      responses:
        '200':
          description: Referidos del cliente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Referido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
    post:
      tags: [Lealtad]
      summary: Referir a un amigo
      description: |
        V2-M12.04 · Registra a un amigo con nombre y teléfono o correo, y la confirmación de que
        aceptó que la agencia lo contacte. La agencia lo atiende como prospecto. Cuando su venta
        se finaliza, el cliente gana 500 puntos (regla del servidor) una sola vez.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferirAmigo'
      responses:
        '201':
          description: Referido registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Referido'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '409':
          description: |
            Esa persona ya es cliente o ya la refirieron (`codigo` REFERIDO_DUPLICADO; no se dice
            quién) o el cliente ya tiene 10 referidos en seguimiento (`codigo` LIMITE_REFERIDOS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /vehiculos/{vehiculoId}/gastos:
    get:
      tags: [Bitácora]
      summary: Gastos del vehículo
      description: |
        V2-M18.01 y V2-M18.04 · Más recientes primero. Con `mes` (`YYYY-MM`) solo los de ese
        mes; sin él, todos. Paginado. Las estadísticas (km/l, $/km, gasto por mes) las calcula
        la app.
      parameters:
        - $ref: '#/components/parameters/VehiculoId'
        - name: mes
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: 2026-11
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Página de gastos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaGastos'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    post:
      tags: [Bitácora]
      summary: Registrar un gasto
      description: |
        V2-M18.01 y V2-M18.04 · `gasolina` exige `litros` y `km`; `otro` exige `descripcion`;
        la `fecha` no puede ser futura. Una carga de gasolina también crea una lectura de km
        de fuente `cliente` y responde 422 KM_INVALIDO si el km es menor a la última lectura.
      parameters:
        - $ref: '#/components/parameters/VehiculoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoGasto'
      responses:
        '201':
          description: Gasto registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gasto'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/KmInvalido'

  /gastos/{gastoId}:
    put:
      tags: [Bitácora]
      summary: Corregir un gasto
      description: |
        V2-M18.04 · Reemplaza el gasto con las mismas reglas que al crearlo. Solo del dueño;
        uno ajeno responde 404.
      parameters:
        - $ref: '#/components/parameters/GastoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoGasto'
      responses:
        '200':
          description: Gasto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gasto'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/KmInvalido'
    delete:
      tags: [Bitácora]
      summary: Borrar un gasto
      description: |
        V2-M18.04 · Solo del dueño. La lectura de km que creó una carga de gasolina se conserva.
      parameters:
        - $ref: '#/components/parameters/GastoId'
      responses:
        '204':
          description: Gasto borrado
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /asistente/preguntas/flujo:
    post:
      tags: [Asistente]
      summary: Preguntar y recibir la respuesta mientras se escribe (Server-Sent Events)
      description: |
        V2-M24.09 · Igual que `POST /asistente/preguntas`, pero responde con `text/event-stream`:
        - `event: texto` con `data` `{"texto": "..."}` por cada parte que escribe el modelo (en orden;
          la app las concatena);
        - `event: fin` con `data` igual a `RespuestaAsistente` (consultaId, respuesta, encontrado, fuentes);
        - `event: error` con `data` `{"codigo": "ASISTENTE_NO_DISPONIBLE"}` si el modelo falla a la mitad.
        Los errores antes de empezar (400, 401, 403, 404, 409, 429, 503) responden igual que
        `POST /asistente/preguntas`, con JSON. Si la app cierra la conexión, el backend guarda lo que
        alcanzó a escribirse en `consulta_asistente` (proveedor con sufijo `-parcial`).
        La app manda `Accept: text/event-stream, application/json` para poder leer tanto el flujo
        como los errores en JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreguntaAsistente'
      responses:
        '200':
          description: Flujo de eventos `texto`, `fin` o `error`
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El modelo y año del vehículo no tienen un manual con texto (`codigo` ASISTENTE_SIN_MANUAL)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'
        '429':
          description: Ya hizo sus preguntas del día (`codigo` ASISTENTE_LIMITE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'
        '503':
          description: Sin cuota del día (`codigo` ASISTENTE_NO_DISPONIBLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /asistente/testigos:
    post:
      tags: [Asistente]
      summary: Identificar una luz del tablero con una foto
      description: |
        V2-M24.05 · El cliente fotografía un testigo del tablero. El backend re-codifica la imagen
        (sin EXIF ni ubicación), la manda a Gemini y no la guarda. Responde qué testigo es, su
        gravedad y qué hacer; si el manual del vehículo lo menciona, cita la página. Si no lo
        reconoce, `reconocido` es false y la app propone describirlo por texto.

        Cuenta para el mismo límite diario que las preguntas (`429` ASISTENTE_LIMITE) y queda en
        `consulta_asistente`, así se puede calificar con `/asistente/consultas/{id}/calificacion`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [vehiculoId, imagen]
              properties:
                vehiculoId:
                  type: integer
                  format: int64
                imagen:
                  type: string
                  format: binary
                  description: JPEG o PNG de hasta 5 MB
      responses:
        '200':
          description: Lo que dice la foto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestigoAsistente'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          description: Ya hizo sus preguntas del día (`codigo` ASISTENTE_LIMITE)
          headers:
            Retry-After:
              description: Segundos que faltan para la medianoche de la agencia
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'
        '503':
          description: Sin cuota del día o el proveedor de IA no responde (`codigo` ASISTENTE_NO_DISPONIBLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

  /asistente/consultas/{consultaId}/calificacion:
    post:
      tags: [Asistente]
      summary: Calificar una respuesta del asistente
      description: |
        V2-M24.07 · Guarda si la respuesta fue útil (👍 `true`, 👎 `false`) en
        `consulta_asistente.util` para medir la calidad del asistente. Calificar otra vez
        reemplaza la calificación.
      parameters:
        - name: consultaId
          in: path
          required: true
          description: El `consultaId` de la respuesta
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalificacionAsistente'
      responses:
        '204':
          description: Calificación guardada
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /eventos:
    get:
      tags: [En vivo]
      summary: Avisos en vivo del cliente (Server-Sent Events)
      description: |
        V2-T05.08 · Conexión abierta con `Accept: text/event-stream`. Cuando cambia una orden de
        servicio de un vehículo del cliente llega el evento `orden` con `data` en JSON
        (`AvisoOrden`); la app vuelve a consultar la orden, también la que muestra en ese momento
        (V2-M04.03). Llega un comentario de latido cada 25 s. El servidor cierra la conexión a los 30 min y la app se reconecta con su token.

        Eventos de asistencia y traslados (solo al cliente dueño, `data` en JSON):
        - `asistencia.estado` (V2-M11.04), `AvisoAsistencia`: cada vez que el personal cambia el
          estado de la solicitud. La app vuelve a consultar `GET /asistencia/{solicitudId}`.
        - `traslado.estado` (V2-M17.03), `AvisoTrasladoEstado`: cada vez que el chofer cambia el
          estado del traslado. La app vuelve a consultar `GET /traslados/{trasladoId}`.
        - `traslado.ubicacion` (V2-M17.03), `AvisoTrasladoUbicacion`: cada vez que el chofer
          reporta su posición en `en_camino` o `de_regreso`; trae el punto, sin necesidad de
          consultar.
        - `mantenimiento.recordatorio` (V2-M05.05), `AvisoMantenimientoRecordatorio`: una vez por
          servicio del plan, cuando el próximo servicio de un vehículo del cliente está a 1 000 km
          o 14 días (configurable en el servidor). La app muestra el aviso; el push (V2-M06.07)
          escuchará este mismo evento.
        - `arco.estado` (V2-M22.02), `AvisoArco`: cuando una solicitud de derechos ARCO cambia de
          estado (el archivo de acceso quedó listo, o falló). La app vuelve a consultar
          `GET /privacidad/arco`.
        - `campana.nueva` (V2-M10.04), `AvisoCampanaNueva`: cuando la agencia publica una campaña
          de seguridad que aplica a un vehículo del cliente. `critica` en `true` pide que el push
          (V2-M06.07) no se pueda silenciar. La app vuelve a consultar
          `GET /vehiculos/{vehiculoId}/campanas`.
        - `garantia.por_vencer` (V2-M10.05), `AvisoGarantiaPorVencer`: una sola vez a 60 días, a
          15 días y a 1 000 km del límite de cada cobertura. La app vuelve a consultar
          `GET /vehiculos/{vehiculoId}/garantia`.
        - `puntos.movidos` (V2-M12.02), `AvisoPuntosMovidos`: cada vez que cambia el saldo de
          puntos del cliente (servicio entregado, canje, devolución o referido). La app vuelve a
          consultar `GET /lealtad` y sus movimientos.
        - `valuacion.oferta` (V2-M26.04), `AvisoValuacionOferta`: cuando la agencia captura o
          renueva la oferta de una valuación del cliente. No trae el monto. La app vuelve a
          consultar `GET /valuaciones/{valuacionId}`.
        - `pedido.estado` (V2-M14.05), `AvisoPedido`: cada vez que cambia el estado de un pedido
          de la tienda del cliente. La app vuelve a consultar `GET /tienda/pedidos/{pedidoId}`.
        - `pago.confirmado` (V2-M08.02 y V2-M14.04), `AvisoPagoConfirmado`: cuando una orden del
          cliente queda pagada, en la app o en caja, o un pedido de la tienda queda pagado en la
          app. Con `ordenId` la app vuelve a consultar el ticket y sus pagos, y con `pedidoId`, el
          pedido y la lista de pedidos.

        Ejemplo en el flujo:
        ```
        event: asistencia.estado
        data: {"solicitudId":12,"estado":"en_camino"}
        ```
      responses:
        '200':
          description: Flujo de eventos
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AvisoOrden'
                  - $ref: '#/components/schemas/AvisoAsistencia'
                  - $ref: '#/components/schemas/AvisoTrasladoEstado'
                  - $ref: '#/components/schemas/AvisoTrasladoUbicacion'
                  - $ref: '#/components/schemas/AvisoMantenimientoRecordatorio'
                  - $ref: '#/components/schemas/AvisoArco'
                  - $ref: '#/components/schemas/AvisoValuacionOferta'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'

  /ordenes/activas:
    get:
      tags: [Taller en vivo]
      summary: Mis órdenes en el taller
      description: |
        V2-M04.01 · Las órdenes de los vehículos del cliente que siguen en el taller o listas
        para entrega, la más reciente primero. Al entregarse dejan de aparecer: la tarjeta de
        Inicio se muestra solo si la lista trae algo. Las órdenes registradas ya hechas en el
        expediente no tienen línea de tiempo y no aparecen. Lista vacía si no hay ninguna.
        V2-M04.06 · La orden lista para entrega trae su total y `horarioEntrega`.
      responses:
        '200':
          description: Órdenes en curso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrdenEnCurso'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'

  /ordenes/{ordenId}:
    get:
      tags: [Taller en vivo]
      summary: Detalle de una orden en el taller
      description: |
        V2-M04.02 y V2-M04.04 · Las etapas que ya empezaron con su hora (la última es la
        actual), la entrega estimada, el asesor, la inspección multipunto con sus fotos y
        videos, y los trabajos adicionales con los totales. Las URL de las evidencias son
        temporales y firmadas (vencen a los 15 minutos): si vencieron, la app vuelve a pedir la
        orden.

        V2-M04.06 y V2-M04.07 · Lista para entrega trae `horarioEntrega`. Al quedar lista, los
        adicionales aprobados pasan a ser renglones de la orden: su ticket es el de
        `GET /servicios/{servicioId}` con el mismo id, y al entregarse aparece en el historial del
        vehículo.
      parameters:
        - $ref: '#/components/parameters/OrdenId'
      responses:
        '200':
          description: La orden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenEnVivo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /ordenes/{ordenId}/adicionales/{adicionalId}/respuesta:
    post:
      tags: [Taller en vivo]
      summary: Aprobar o rechazar un trabajo adicional
      description: |
        V2-M04.05 · Uno por uno y siempre con la firma en pantalla. La respuesta queda
        registrada con quién, cuándo y la firma, y ya no cambia. Devuelve la orden con los
        totales recalculados.
      parameters:
        - $ref: '#/components/parameters/OrdenId'
        - name: adicionalId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespuestaAdicional'
      responses:
        '200':
          description: La orden con la respuesta y los totales recalculados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenEnVivo'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/CuentaDesactivada'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: |
            El trabajo ya tiene respuesta (`codigo` ADICIONAL_YA_RESPONDIDO) o la orden ya está
            terminada (`codigo` ORDEN_CERRADA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problema'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    DireccionId:
      name: direccionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ModeloId:
      name: modeloId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TrasladoId:
      name: trasladoId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    VehiculoId:
      name: vehiculoId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OrdenId:
      name: ordenId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Pagina:
      name: pagina
      in: query
      required: false
      description: Número de página, desde 0
      schema:
        type: integer
        minimum: 0
        default: 0
    GastoId:
      name: gastoId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ValuacionId:
      name: valuacionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Tamano:
      name: tamano
      in: query
      required: false
      description: Elementos por página
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

  responses:
    NoAutenticado:
      description: |
        Sin token, token inválido o vencido. La app intenta `/auth/refrescar` una vez y,
        si falla, vuelve al login.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problema'
    CuentaDesactivada:
      description: |
        La agencia desactivó la cuenta (CRM-1.3), `codigo` CUENTA_DESACTIVADA. La app cierra
        la sesión y muestra el `message`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problema'
    DemasiadosIntentos:
      description: Demasiados intentos seguidos (`codigo` DEMASIADOS_INTENTOS)
      headers:
        Retry-After:
          description: Segundos que faltan para poder intentar de nuevo
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoEncontrado:
      description: No existe o no pertenece al cliente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problema'
    FueraDeCobertura:
      description: La dirección queda fuera de la zona de cobertura (`codigo` FUERA_DE_COBERTURA)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problema'
    KmInvalido:
      description: El kilometraje es menor a la última lectura oficial o del cliente (`codigo` KM_INVALIDO)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problema'
    DatosInvalidos:
      description: Datos de entrada inválidos (`codigo` DATOS_INVALIDOS)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problema'
    DatosFiscalesInvalidos:
      description: |
        Un dato fiscal no cumple las reglas del SAT (`codigo` DATOS_FISCALES_INVALIDOS). `campos`
        dice qué corregir en cada uno, con el nombre del campo de la petición.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            timestamp: '2026-11-26T18:00:00Z'
            status: 400
            error: Bad Request
            message: El dígito verificador del RFC no coincide; revisa la homoclave
            codigo: DATOS_FISCALES_INVALIDOS
            campos:
              rfc: El dígito verificador del RFC no coincide; revisa la homoclave
            path: /api/v1/app/perfiles-fiscales

  schemas:
    PreguntaAsistente:
      type: object
      required: [vehiculoId, pregunta]
      properties:
        vehiculoId:
          type: integer
          format: int64
          description: Uno de los vehículos del cliente
        pregunta:
          type: string
          minLength: 1
          maxLength: 500
          example: ¿Cada cuánto cambio el aceite?
    RespuestaAsistente:
      type: object
      required: [consultaId, respuesta, encontrado, fuentes]
      properties:
        consultaId:
          type: integer
          format: int64
        respuesta:
          type: string
          example: Cada 10 000 km o un año, lo que ocurra primero.
        encontrado:
          type: boolean
          description: false si el manual no tiene la respuesta; entonces no hay fuentes
        fuentes:
          type: array
          items:
            $ref: '#/components/schemas/FuenteAsistente'
    TestigoAsistente:
      type: object
      required: [consultaId, reconocido, fuentes]
      properties:
        consultaId:
          type: integer
          format: int64
        reconocido:
          type: boolean
          description: false si la foto no muestra un testigo que se pueda identificar
        testigo:
          type: string
          nullable: true
          example: Presión de aceite
        gravedad:
          type: string
          nullable: true
          enum: [roja, amarilla, informativa]
          description: roja = detenerse en un lugar seguro; amarilla = agendar revisión pronto
        queHacer:
          type: string
          nullable: true
          example: Detente en un lugar seguro, apaga el motor y revisa el nivel de aceite.
        fuentes:
          type: array
          items:
            $ref: '#/components/schemas/FuenteAsistente'
    CalificacionAsistente:
      type: object
      required: [util]
      properties:
        util:
          type: boolean
          description: true si la respuesta sirvió (👍), false si no (👎)
    FuenteAsistente:
      type: object
      required: [manualId, pagina, titulo]
      properties:
        manualId:
          type: integer
          format: int64
        pagina:
          type: integer
          example: 12
        titulo:
          type: string
          example: Manual, pág. 12
    LoginRequest:
      type: object
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
          description: Se ignoran mayúsculas y espacios al inicio y al final
        contrasena:
          type: string
          format: password
        dispositivo:
          type: string
          maxLength: 80
          description: >
            V2-M01.09 · Nombre que la app le pone a este aparato («Pixel 7 · Android 14»),
            para que el cliente reconozca sus sesiones. Opcional: si no llega, la sesión
            queda sin nombre y la app muestra un texto genérico.

    LoginResponse:
      type: object
      required: [accessToken, expiresIn, refreshToken, debeCambiarContrasena]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          description: Segundos de vida del accessToken. Es configurable; la app usa el valor recibido.
          example: 3600
        refreshToken:
          type: string
          description: Un solo uso; vence a los 30 días
        debeCambiarContrasena:
          type: boolean
          description: true si la contraseña es temporal (APP-2.3)

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    CambiarContrasenaRequest:
      type: object
      required: [contrasenaActual, contrasenaNueva]
      properties:
        contrasenaActual:
          type: string
          format: password
        contrasenaNueva:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Al menos una letra y un número; distinta de la actual

    RestablecerContrasenaRequest:
      type: object
      required: [contrasenaNueva]
      description: Con `token`, o con `correo` y `codigo` (app v1). Si llega `token`, se usa ese.
      properties:
        token:
          type: string
          maxLength: 100
          description: V2-T05.04 · Token del enlace de un solo uso que llegó al correo
        correo:
          type: string
          format: email
        codigo:
          type: string
          pattern: '^[0-9]{6}$'
          description: Código de 6 dígitos que llegó al correo
        contrasenaNueva:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Al menos una letra y un número

    SesionActiva:
      type: object
      required: [id, expiraEn]
      description: V2-M01.09 · Una sesión abierta del cliente.
      properties:
        id:
          type: integer
          format: int64
        dispositivo:
          type: string
          maxLength: 80
          nullable: true
          description: >
            Nombre que mandó la app al entrar. Nulo en las sesiones anteriores a
            V2-M01.09 y en las de un cliente que no lo manda.
        ultimoUso:
          type: string
          format: date-time
          nullable: true
          description: Cuándo se refrescó por última vez. Nulo si nunca se ha refrescado.
        iniciadaEn:
          type: string
          format: date-time
          description: >
            Cuándo empezó la sesión de verdad, no cuándo se refrescó por última vez:
            se conserva entre refrescos. Nulo en las sesiones anteriores a V2-M01.09.
          nullable: true
        expiraEn:
          type: string
          format: date-time
          description: >
            A los 30 días del **último refresco**, no del inicio: cada refresco emite
            una sesión nueva con 30 días por delante. Usar la app la mantiene viva.

    CambioDeCorreoRequest:
      type: object
      required: [correo, contrasenaActual]
      description: V2-M01.07 · Lo que se manda para pedir el cambio de correo.
      properties:
        correo:
          type: string
          format: email
          maxLength: 120
        contrasenaActual:
          type: string
          format: password
          description: >
            Confirma que quien lo pide es el titular. Si no coincide, 400 con
            `CREDENCIALES_INVALIDAS`.

    VerificacionPendiente:
      type: object
      required: [id, expira]
      description: >
        V2-M01.07 · La verificación que se acaba de crear. No trae el correo nuevo: quien
        pidió el cambio ya lo escribió, y repetirlo solo sería un dato personal más viajando.
      properties:
        id:
          type: integer
          format: int64
        expira:
          type: string
          format: date-time
          description: A los 15 minutos, igual que el código de recuperación.

    ConfirmarVerificacionRequest:
      type: object
      required: [codigo]
      description: V2-M01.07 · El código de 6 dígitos que llegó al correo nuevo.
      properties:
        codigo:
          type: string
          minLength: 6
          maxLength: 6

    Perfil:
      type: object
      required: [id, nombre, correo, clienteDesde]
      description: >
        Datos de solo lectura del cliente autenticado. Editarlos es V2-M01.07, con su
        verificación por código.
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        correo:
          type: string
          format: email
        telefono:
          type: string
          maxLength: 20
          nullable: true
          description: >
            V2-M01.06 · Nulo cuando la agencia no lo capturó al dar de alta al cliente, que
            pasa seguido. La app lo muestra como un dato que falta, no como un error.
        clienteDesde:
          type: string
          format: date
          description: >
            V2-M01.06 · Desde cuándo es cliente de la agencia. **Siempre viene**:
            `cliente.created_at` es `not null` desde la V7. Es una **fecha**, no un instante:
            sale de ese `created_at` resuelto en la zona de la agencia, porque convertirlo en
            el celular haría que quien se registró el 1 de marzo a las 02:00 UTC apareciera
            como «desde febrero» en México.

    Vehiculo:
      type: object
      description: |
        Vehículo del cliente (expediente, ERP-3.0). Como en la factura, `modelo` se muestra
        como Tipo (Sentra) y `anio` como Modelo (2026).
      required: [id, vin, modelo, anio]
      properties:
        id:
          type: integer
          format: int64
        vin:
          type: string
        marca:
          type: string
          nullable: true
          description: Puede faltar en vehículos registrados antes de que se guardara.
          example: Nissan
        modelo:
          type: string
          description: Tipo del vehículo
          example: Sentra
        anio:
          type: integer
          description: Modelo (año) del vehículo
          example: 2026
        version:
          type: string
          nullable: true
          description: Puede faltar en vehículos registrados antes de que se guardara.
          example: Advance
        placas:
          type: string
          nullable: true
        kilometraje:
          type: integer
          nullable: true
        color:
          type: string
          nullable: true
          maxLength: 40
          description: Color del vehículo; lo fija Servicio.
          example: Blanco

    Manual:
      type: object
      required: [id, modelo, anio, url]
      properties:
        id:
          type: integer
          format: int64
        marca:
          type: string
          example: Nissan
        modelo:
          type: string
          description: Tipo del vehículo
          example: March
        anio:
          type: integer
          description: Modelo (año) del vehículo
          example: 2026
        titulo:
          type: string
          description: Nombre para mostrar el manual.
          example: Nissan March 2026 Manual de propietario
        url:
          type: string
          description: |
            URL temporal firmada para descargar el PDF, sin token. Vence a los 15 minutos;
            si venció, la app vuelve a pedir la lista.

    Servicio:
      type: object
      description: Orden de servicio vista por el cliente (ERP-3.1)
      required: [id, fecha, estatus, total]
      properties:
        id:
          type: integer
          format: int64
        fecha:
          type: string
          format: date
        estatus:
          type: string
          enum: [RECIBIDO, EN_PROCESO, TERMINADO, ENTREGADO]
          description: |
            Conjunto cerrado (PO-5). V2-T05.06 · Es el `estatus` de `orden_servicio`; hoy el
            backend solo responde TERMINADO porque el expediente registra servicios ya hechos.
        fechaCierre:
          type: string
          nullable: true
          example: '2026-10-20T13:45:00'
          description: V2-M02.05 · Cuándo se cerró la orden, en hora de la agencia; nula si sigue abierta
        total:
          type: number
          format: double
          description: Mano de obra más refacciones

    ServicioDetalle:
      type: object
      description: V2-M02.06 · Ticket de una orden de servicio
      required: [id, vehiculoId, fecha, kilometraje, estatus, manoDeObra, refacciones, totalManoDeObra,
        totalRefacciones, subtotal, iva, total]
      properties:
        id:
          type: integer
          format: int64
        vehiculoId:
          type: integer
          format: int64
        fecha:
          type: string
          format: date
        kilometraje:
          type: integer
        estatus:
          type: string
          enum: [RECIBIDO, EN_PROCESO, TERMINADO, ENTREGADO]
        fechaCierre:
          type: string
          nullable: true
          example: '2026-10-20T13:45:00'
          description: En hora de la agencia; nula si la orden sigue abierta
        manoDeObra:
          type: array
          items:
            $ref: '#/components/schemas/RenglonTicket'
        refacciones:
          type: array
          items:
            $ref: '#/components/schemas/RenglonTicket'
        totalManoDeObra:
          type: number
          format: double
        totalRefacciones:
          type: number
          format: double
        subtotal:
          type: number
          format: double
          description: Total sin IVA
        iva:
          type: number
          format: double
        total:
          type: number
          format: double
          description: totalManoDeObra + totalRefacciones, con IVA incluido
        puntosGanados:
          type: integer
          nullable: true
          description: V2-M12.02 · Puntos de lealtad que dio la orden al entregarse; nulo si no dio
        pago:
          description: V2-M08.02 · El pago con que quedó pagada, en la app o en caja; nulo si no se ha pagado
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Pago'
        pagable:
          type: boolean
          description: |
            V2-M08.02 · Se puede pagar en la app: viene del taller, está lista para entrega o
            entregada, tiene total y nadie la ha pagado.

    RenglonTicket:
      type: object
      required: [concepto, cantidad, precio, importe]
      properties:
        concepto:
          type: string
        cantidad:
          type: integer
          minimum: 1
        precio:
          type: number
          format: double
          description: Precio unitario con IVA incluido
        importe:
          type: number
          format: double
          description: cantidad × precio

    PlanMantenimiento:
      type: object
      required: [vehiculoId, kmActual, kmActualizadoEn, kmFuente, promedioKmDiario, servicios, proximo]
      properties:
        vehiculoId:
          type: integer
          format: int64
        kmActual:
          type: integer
          nullable: true
          description: El mayor entre el km oficial del vehículo y la última lectura del cliente
        kmActualizadoEn:
          type: string
          format: date
          nullable: true
        kmFuente:
          type: string
          nullable: true
          enum: [taller, cliente]
        promedioKmDiario:
          type: number
          nullable: true
          description: Con las lecturas; nulo si hay menos de dos
        servicios:
          type: array
          items:
            $ref: '#/components/schemas/ServicioMantenimiento'
        proximo:
          allOf:
            - $ref: '#/components/schemas/ProximoServicio'
          nullable: true

    ServicioMantenimiento:
      type: object
      required: [id, nombre, km, meses, precioEstimado, conceptos, estado, hechoEn]
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
          example: Servicio de 10,000 km
        km:
          type: integer
        meses:
          type: integer
        precioEstimado:
          type: number
          description: Estimación no vinculante; la app muestra la leyenda de estimado
        conceptos:
          type: array
          items:
            type: string
        estado:
          type: string
          enum: [hecho, pendiente, proximo, vencido]
        hechoEn:
          type: string
          format: date
          nullable: true

    ProximoServicio:
      type: object
      required: [servicioId, nombre, kmObjetivo, fechaEstimada, faltanKm, faltanDias, motivo]
      properties:
        servicioId:
          type: integer
          format: int64
        nombre:
          type: string
        kmObjetivo:
          type: integer
        fechaEstimada:
          type: string
          format: date
        faltanKm:
          type: integer
        faltanDias:
          type: integer
        motivo:
          type: string
          description: Lo que llega primero
          enum: [km, tiempo]

    NuevaLecturaKm:
      type: object
      required: [km]
      properties:
        km:
          type: integer
          minimum: 1

    LecturaKm:
      type: object
      required: [id, km, fuente, registradaEn]
      properties:
        id:
          type: integer
          format: int64
        km:
          type: integer
        fuente:
          type: string
          enum: [cliente]
        registradaEn:
          type: string
          format: date-time
        fotoUrl:
          type: string
          description: |
            URL temporal firmada de la foto del tablero (vence a los 15 minutos). Solo viene si
            la lectura se registró con foto (V2-M05.03).

    Gasto:
      type: object
      required: [id, vehiculoId, tipo, monto, litros, km, fecha, descripcion]
      properties:
        id:
          type: integer
          format: int64
        vehiculoId:
          type: integer
          format: int64
        tipo:
          $ref: '#/components/schemas/TipoGasto'
        monto:
          type: number
        litros:
          type: number
          nullable: true
        km:
          type: integer
          nullable: true
        fecha:
          type: string
          format: date
        descripcion:
          type: string
          nullable: true
          maxLength: 200

    NuevoGasto:
      type: object
      required: [tipo, monto, fecha]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoGasto'
        monto:
          type: number
          exclusiveMinimum: true
          minimum: 0
        litros:
          type: number
          nullable: true
          description: Obligatorio y mayor a 0 en `gasolina`
        km:
          type: integer
          nullable: true
          description: Obligatorio en `gasolina`
        fecha:
          type: string
          format: date
          description: No puede ser futura
        descripcion:
          type: string
          nullable: true
          maxLength: 200
          description: Obligatoria en `otro`

    TipoGasto:
      type: string
      enum: [gasolina, estacionamiento, casetas, lavado, otro]

    PaginaGastos:
      type: object
      required: [contenido, pagina, tamano, totalElementos, totalPaginas]
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/Gasto'
        pagina:
          type: integer
        tamano:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer

    PaginaServicios:
      type: object
      required: [contenido, pagina, tamano, totalElementos, totalPaginas]
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/Servicio'
        pagina:
          type: integer
        tamano:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer

    Disponibilidad:
      type: object
      required: [fecha, franjaId, horaInicio, horaFin, cupoDisponible]
      properties:
        fecha:
          type: string
          format: date
        franjaId:
          type: integer
          format: int64
          description: |
            V2-T05.07 · Id de la fila de `franja_horario`. Cada franja es de un día de la semana;
            la app lo toma de esta respuesta y lo manda tal cual al agendar o reprogramar.
        horaInicio:
          type: string
          example: '09:00'
        horaFin:
          type: string
          example: '10:00'
        cupoDisponible:
          type: integer
          minimum: 1

    NuevaCita:
      type: object
      required: [vehiculoId, franjaId, fecha]
      properties:
        vehiculoId:
          type: integer
          format: int64
        franjaId:
          type: integer
          format: int64
          description: V2-T05.07 · Id de `franja_horario` tomado de la disponibilidad de esa fecha.
        fecha:
          type: string
          format: date
        motivo:
          $ref: '#/components/schemas/MotivoCita'
        recoleccion:
          $ref: '#/components/schemas/NuevaRecoleccion'

    NuevaRecoleccion:
      type: object
      nullable: true
      description: V2-M17.02 · Pide que recojan y entreguen el vehículo en una dirección guardada.
      required: [direccionId]
      properties:
        direccionId:
          type: integer
          format: int64

    MotivoCita:
      type: string
      nullable: true
      description: |
        V2-M02.08 · Opcional. Se acepta sin importar mayúsculas y siempre se devuelve en
        minúsculas. V2-M10.03 · `campana` es el de las citas que atienden una campaña de
        seguridad; se agendan desde la campaña. V2-M26.03 · `valuacion` es el de las inspecciones
        de una valuación formal. Solo se crea con `POST /valuaciones/{valuacionId}/cita`:
        `POST /citas` con ese motivo responde 400 `DATOS_INVALIDOS`.
      enum: [mantenimiento, reparacion, revision, garantia, campana, valuacion, otro]

    ReprogramarCita:
      type: object
      required: [franjaId]
      properties:
        franjaId:
          type: integer
          format: int64
          description: V2-T05.07 · Id de `franja_horario`; debe ser del día de la cita o de `fecha`.
        fecha:
          type: string
          format: date
          description: Opcional; si falta se queda el día de la cita.

    FichaTecnica:
      type: object
      required: [vehiculoId, modelo, anio, secciones]
      properties:
        vehiculoId:
          type: integer
          format: int64
        marca:
          type: string
          nullable: true
        modelo:
          type: string
        anio:
          type: integer
        version:
          type: string
          nullable: true
        secciones:
          type: array
          description: Vacía si la agencia aún no carga la ficha de ese modelo y año.
          items:
            type: object
            required: [nombre, especificaciones]
            properties:
              nombre:
                type: string
              especificaciones:
                type: array
                items:
                  type: object
                  required: [nombre, valor]
                  properties:
                    nombre:
                      type: string
                    valor:
                      type: string

    EstadoCita:
      type: string
      enum: [CONFIRMADA, ATENDIDA, NO_ASISTIO, CANCELADA]

    Cita:
      type: object
      required: [id, vehiculoId, franjaId, fecha, horaInicio, horaFin, estado]
      properties:
        id:
          type: integer
          format: int64
        vehiculoId:
          type: integer
          format: int64
        vehiculo:
          type: string
          nullable: true
          description: Descripción corta del vehículo, p. ej. "Nissan March 2026 Advance"
        franjaId:
          type: integer
          format: int64
          description: V2-T05.07 · Id de `franja_horario` de la cita.
        fecha:
          type: string
          format: date
        horaInicio:
          type: string
        horaFin:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoCita'
        motivo:
          $ref: '#/components/schemas/MotivoCita'
        recoleccion:
          allOf:
            - $ref: '#/components/schemas/RecoleccionCita'
          nullable: true
          description: |
            V2-M17.02 · Traslados de recoger y entregar con su estado actual. Viene en `POST /citas`
            (cuando se agenda con `recoleccion`), en `GET /citas`, en cancelar y en reprogramar
            (V2-M17.03). Es nula si la cita no tiene recolección; un traslado cancelado sigue en la
            lista con `estado: cancelado`.

    PaginaCitas:
      type: object
      required: [contenido, pagina, tamano, totalElementos, totalPaginas]
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/Cita'
        pagina:
          type: integer
        tamano:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer

    ModeloCatalogo:
      type: object
      description: Lo que no es id, marca, modelo y año es opcional mientras el PO lo define (APP-4.1)
      required: [id, marca, modelo, anio, activo]
      properties:
        id:
          type: integer
          format: int64
        marca:
          type: string
        modelo:
          type: string
        anio:
          type: integer
        version:
          type: string
          nullable: true
        precioDesde:
          type: number
          nullable: true
          description: Precio de lista más bajo, con IVA
        imagenUrl:
          type: string
          nullable: true
          description: URL https
        descripcion:
          type: string
          nullable: true
        activo:
          type: boolean
          description: Siempre true en la app

    DetalleModeloCatalogo:
      type: object
      description: |
        Un modelo del catálogo con su galería, sus versiones y su ficha resumida (V2-M03.02).
        Los campos de `ModeloCatalogo` significan lo mismo aquí.
      required: [id, marca, modelo, anio, activo, imagenes, versiones, especificaciones]
      properties:
        id:
          type: integer
          format: int64
        marca:
          type: string
        modelo:
          type: string
        anio:
          type: integer
        version:
          type: string
          nullable: true
        precioDesde:
          type: number
          nullable: true
          description: Precio de lista más bajo de esta versión, con IVA
        imagenUrl:
          type: string
          nullable: true
          description: Foto de portada, URL https
        descripcion:
          type: string
          nullable: true
        activo:
          type: boolean
          description: Siempre true en la app
        imagenes:
          type: array
          description: Galería, ordenada por `orden`
          items:
            $ref: '#/components/schemas/ImagenModelo'
        versiones:
          type: array
          description: Versiones activas de la misma marca, modelo y año, de la más barata a la más cara
          items:
            $ref: '#/components/schemas/VersionModelo'
        especificaciones:
          type: array
          description: Ficha resumida, de 4 a 8 datos que la agencia captura, ordenados por `orden`
          items:
            $ref: '#/components/schemas/EspecificacionModelo'

    ImagenModelo:
      type: object
      required: [id, url, orden]
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
          description: URL https
        color:
          type: string
          nullable: true
          maxLength: 40
          description: Color del auto en la foto, para agrupar la galería por color
          example: Blanco
        descripcion:
          type: string
          nullable: true
          maxLength: 120
          description: Texto para el lector de pantalla
          example: Frente de la Mazda CX-5 blanca
        orden:
          type: integer
          minimum: 0

    VersionModelo:
      type: object
      required: [id, nombre]
      properties:
        id:
          type: integer
          format: int64
          description: Id del modelo del catálogo de esa versión, sirve para pedir su detalle
        nombre:
          type: string
          description: Nombre de la versión. Si el modelo no tiene versión, el nombre del modelo
          example: Signature
        precioDesde:
          type: number
          nullable: true
          description: Precio de lista, con IVA

    EspecificacionModelo:
      type: object
      required: [etiqueta, valor]
      properties:
        etiqueta:
          type: string
          maxLength: 60
          example: Motor
        valor:
          type: string
          maxLength: 120
          example: 2.5 L, 4 cilindros
        orden:
          type: integer
          minimum: 0

    EstadoVehiculo:
      type: string
      description: Estado general del auto según el cliente
      enum: [EXCELENTE, BUENO, REGULAR, MALO]

    NuevaEstimacionTomaCuenta:
      type: object
      description: |
        Indica el auto con `vehiculoId` o con `marca`, `modelo` y `anio`, nunca con ambas
        formas ni con ninguna.
      required: [km, estado]
      properties:
        vehiculoId:
          type: integer
          format: int64
          nullable: true
          description: Uno de los vehículos del cliente
        marca:
          type: string
          nullable: true
          maxLength: 40
          example: Nissan
        modelo:
          type: string
          nullable: true
          maxLength: 80
          description: Tipo del vehículo, como en `Vehiculo.modelo`
          example: Versa
        anio:
          type: integer
          nullable: true
          minimum: 1900
          example: 2021
        km:
          type: integer
          minimum: 0
          maximum: 999999
          description: Kilometraje actual
          example: 48000
        estado:
          $ref: '#/components/schemas/EstadoVehiculo'
        modeloCatalogoId:
          type: integer
          format: int64
          nullable: true
          description: Modelo nuevo contra el que se estima, opcional

    SupuestosEstimacion:
      type: object
      description: Lo que usó la fórmula, para mostrarlo al cliente y para auditar el resultado
      required: [valorBase, edadAnios, kmEsperado, ajusteKm, ajusteEstado, margen]
      properties:
        valorBase:
          type: number
          description: Valor de referencia de la agencia para esa marca, modelo y año
        edadAnios:
          type: integer
          minimum: 0
        kmEsperado:
          type: integer
          description: Kilometraje que se espera por la edad del auto
        ajusteKm:
          type: number
          description: Multiplicador por kilometraje, entre 0.5 y 1.2
        ajusteEstado:
          type: number
          description: Multiplicador por estado general
        margen:
          type: number
          description: Fracción que se resta y se suma al valor estimado para dar el rango
          example: 0.08

    CalculoEstreno:
      type: object
      required: [modeloCatalogoId, enganche, plazoMeses]
      properties:
        modeloCatalogoId:
          type: integer
          format: int64
        enganche:
          type: number
          description: En pesos; al menos el enganche mínimo de los parámetros
        plazoMeses:
          type: integer
          description: Uno de los plazos permitidos (12, 24, 36, 48, 60)
    CotizacionEstreno:
      type: object
      required: [precio, enganche, montoFinanciado, tasaAnual, plazoMeses, mensualidad, leyenda]
      properties:
        precio:
          type: number
        enganche:
          type: number
        montoFinanciado:
          type: number
        tasaAnual:
          type: number
          example: 0.1499
        plazoMeses:
          type: integer
        mensualidad:
          type: number
        leyenda:
          type: string
    NuevaSolicitudEstreno:
      type: object
      required: [tipo, modeloCatalogoId]
      properties:
        tipo:
          type: string
          enum: [PRUEBA_MANEJO, COTIZACION]
        modeloCatalogoId:
          type: integer
          format: int64
        preferenciaFecha:
          type: string
          format: date
          description: Solo PRUEBA_MANEJO (obligatoria); desde mañana
        preferenciaFranja:
          type: string
          enum: [MANANA, TARDE]
          description: Solo PRUEBA_MANEJO (obligatoria)
        enganche:
          type: number
          description: Solo COTIZACION (obligatorio)
        plazoMeses:
          type: integer
          description: Solo COTIZACION (obligatorio)
        estimacionTomaCuentaId:
          type: integer
          format: int64
          nullable: true
          description: V2-M16.03 · Una estimación del cliente
    SolicitudEstreno:
      type: object
      required: [id, tipo, modeloCatalogoId, modelo, estado, creadaEn]
      properties:
        id:
          type: integer
          format: int64
        tipo:
          type: string
          enum: [PRUEBA_MANEJO, COTIZACION]
        modeloCatalogoId:
          type: integer
          format: int64
        modelo:
          type: string
          example: Nissan Kicks 2026 Advance
        estado:
          type: string
          enum: [RECIBIDA, EN_ATENCION, CERRADA]
        vendedor:
          type: string
          nullable: true
          description: Nombre del vendedor asignado, cuando ya hay
        preferenciaFecha:
          type: string
          format: date
          nullable: true
        preferenciaFranja:
          type: string
          nullable: true
          enum: [MANANA, TARDE]
        cotizacion:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CotizacionEstreno'
        estimacionTomaCuentaId:
          type: integer
          format: int64
          nullable: true
        creadaEn:
          type: string
          format: date-time
    AvisoPrivacidad:
      type: object
      required: [id, version, texto, vigenteDesde, aceptado]
      properties:
        id:
          type: integer
          format: int64
        version:
          type: integer
          example: 1
        texto:
          type: string
          description: Texto completo del aviso; los párrafos van separados por una línea en blanco
        vigenteDesde:
          type: string
          format: date-time
        aceptado:
          type: boolean
          description: Si esta cuenta ya aceptó esta versión
        aceptadoEn:
          type: string
          format: date-time
          nullable: true
    AceptarAviso:
      type: object
      required: [avisoId]
      properties:
        avisoId:
          type: integer
          format: int64
          description: El `id` del aviso que se leyó; debe ser el vigente
    AceptacionAviso:
      type: object
      required: [avisoId, version, aceptadoEn]
      properties:
        avisoId:
          type: integer
          format: int64
        version:
          type: integer
        aceptadoEn:
          type: string
          format: date-time
    CancelarCuenta:
      type: object
      description: V2-M22.03 · La contraseña actual confirma que quien pide borrar la cuenta es su titular
      required: [contrasena]
      properties:
        contrasena:
          type: string
          format: password

    SolicitudArco:
      type: object
      description: V2-M22.02 · Una solicitud de derechos ARCO de esta cuenta
      required: [id, tipo, estado, creadaEn]
      properties:
        id:
          type: integer
          format: int64
        tipo:
          type: string
          enum: [ACCESO, RECTIFICACION, CANCELACION, OPOSICION]
        estado:
          type: string
          enum: [PENDIENTE, RESUELTA, FALLIDA, VENCIDA]
          description: |
            `PENDIENTE` se está preparando; `RESUELTA` ya se atendió (en el acceso, el archivo se puede
            descargar); `FALLIDA` no se pudo preparar y hay que pedirla otra vez; `VENCIDA` el archivo
            ya no está disponible.
        creadaEn:
          type: string
          format: date-time
        resueltaEn:
          type: string
          format: date-time
          nullable: true
        venceEn:
          type: string
          format: date-time
          nullable: true
          description: Hasta cuándo se puede descargar el archivo (7 días después de resolverse)

    AvisoArco:
      type: object
      description: V2-M22.02 · `data` del evento `arco.estado`
      required: [solicitudId, tipo, estado]
      properties:
        solicitudId:
          type: integer
          format: int64
        tipo:
          type: string
          enum: [ACCESO, RECTIFICACION, CANCELACION, OPOSICION]
        estado:
          type: string
          enum: [PENDIENTE, RESUELTA, FALLIDA, VENCIDA]

    EstimacionTomaCuenta:
      type: object
      description: |
        Una estimación no vinculante. `minimo` y `maximo` son pesos con IVA incluido, ya
        redondeados a 100. Esto no es una oferta de compra.
      required: [id, creadaEn, marca, modelo, anio, km, estado, minimo, maximo, supuestos]
      properties:
        id:
          type: integer
          format: int64
        creadaEn:
          type: string
          format: date-time
          description: En UTC
        vehiculoId:
          type: integer
          format: int64
          nullable: true
          description: El vehículo del cliente, si se estimó con uno
        marca:
          type: string
        modelo:
          type: string
        anio:
          type: integer
        km:
          type: integer
        estado:
          $ref: '#/components/schemas/EstadoVehiculo'
        modeloCatalogoId:
          type: integer
          format: int64
          nullable: true
        modeloDestino:
          type: string
          nullable: true
          description: Nombre del modelo nuevo, como "Mazda CX-5 2024", escrito al momento de estimar
        precioDestino:
          type: number
          nullable: true
          description: Precio de lista del modelo nuevo al momento de estimar, con IVA
        minimo:
          type: number
        maximo:
          type: number
        supuestos:
          $ref: '#/components/schemas/SupuestosEstimacion'

    PaginaEstimaciones:
      type: object
      required: [contenido, pagina, tamano, totalElementos, totalPaginas]
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/EstimacionTomaCuenta'
        pagina:
          type: integer
        tamano:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer

    NuevaValuacion:
      type: object
      required: [estimacionTomaCuentaId]
      properties:
        estimacionTomaCuentaId:
          type: integer
          format: int64

    EstadoValuacion:
      type: string
      enum: [SOLICITADA, CITA_AGENDADA, OFERTADA, ACEPTADA, RECHAZADA, VENCIDA]

    TomaValuacion:
      type: string
      description: V2-M26.02 · Las 8 tomas guiadas, en el orden en que la app las pide.
      enum:
        - FRENTE
        - TRASERA
        - LATERAL_IZQUIERDO
        - LATERAL_DERECHO
        - INTERIOR_DELANTERO
        - INTERIOR_TRASERO
        - TABLERO_KM
        - CAJUELA

    FotoValuacion:
      type: object
      required: [toma, url, subidaEn]
      properties:
        toma:
          $ref: '#/components/schemas/TomaValuacion'
        url:
          type: string
          description: URL temporal firmada, relativa al servidor. Vence a los 15 minutos.
        subidaEn:
          type: string
          format: date-time
          description: En UTC

    InspeccionValuacion:
      type: object
      required: [citaId, fecha, horaInicio, horaFin]
      properties:
        citaId:
          type: integer
          format: int64
        fecha:
          type: string
          format: date
        horaInicio:
          type: string
          example: '09:00'
        horaFin:
          type: string
          example: '10:00'

    OfertaValuacion:
      type: object
      description: |
        V2-M26.04 · La oferta formal de la agencia, a diferencia de la estimación. No se edita
        mientras está vigente.
      required: [monto, vigenciaHasta, ofertadaEn]
      properties:
        monto:
          type: number
          description: Pesos con IVA
        vigenciaHasta:
          type: string
          format: date
          description: Último día en que se puede responder, hora de la agencia, inclusive
        nota:
          type: string
          nullable: true
          maxLength: 500
        ofertadaEn:
          type: string
          format: date-time
          description: En UTC

    AvisoPedido:
      type: object
      description: V2-M14.05 · `data` del evento `pedido.estado`
      required: [pedidoId, estado]
      properties:
        pedidoId:
          type: integer
          format: int64
        estado:
          $ref: '#/components/schemas/EstadoPedido'

    CategoriaProducto:
      type: string
      enum: [accesorio, refaccion, cuidado]

    EntregaPedido:
      type: string
      enum: [mostrador, cita]

    EstadoPedido:
      type: string
      enum: [apartado, listo, entregado, cancelado]

    Producto:
      type: object
      required: [id, codigo, nombre, categoria, precio, existencia, universal, compatibilidad]
      properties:
        id:
          type: integer
          format: int64
        codigo:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        categoria:
          $ref: '#/components/schemas/CategoriaProducto'
        precio:
          type: number
          description: Precio final en pesos.
        fotoUrl:
          type: string
        existencia:
          type: integer
          minimum: 0
        universal:
          type: boolean
          description: Le queda a cualquier vehículo.
        compatibilidad:
          type: array
          items:
            $ref: '#/components/schemas/CompatibilidadProducto'
        compatible:
          type: boolean
          description: Solo viene cuando se pidió con `vehiculoId`.

    CompatibilidadProducto:
      type: object
      required: [modelo, anioDesde, anioHasta]
      properties:
        modelo:
          type: string
        anioDesde:
          type: integer
        anioHasta:
          type: integer

    PaginaProductos:
      type: object
      required: [contenido, pagina, tamano, totalElementos, totalPaginas]
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/Producto'
        pagina:
          type: integer
        tamano:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer

    NuevoPedido:
      type: object
      required: [renglones, entrega]
      properties:
        renglones:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [productoId, cantidad]
            properties:
              productoId:
                type: integer
                format: int64
              cantidad:
                type: integer
                minimum: 1
                maximum: 10
        entrega:
          $ref: '#/components/schemas/EntregaPedido'
        citaId:
          type: integer
          format: int64
          description: Obligatorio con `entrega` `cita`.

    InstalacionPedido:
      type: object
      properties:
        citaId:
          type: integer
          format: int64
          nullable: true

    Pedido:
      type: object
      required: [id, estado, entrega, total, creadoEn, renglones, pagable]
      properties:
        id:
          type: integer
          format: int64
        estado:
          $ref: '#/components/schemas/EstadoPedido'
        entrega:
          $ref: '#/components/schemas/EntregaPedido'
        total:
          type: number
        creadoEn:
          type: string
          format: date-time
        venceEn:
          type: string
          format: date-time
          description: Solo en `apartado` y `listo`. Pasada esa hora el pedido se cancela y libera las piezas.
        listoEn:
          type: string
          format: date-time
        entregadoEn:
          type: string
          format: date-time
        canceladoEn:
          type: string
          format: date-time
        motivoCancelacion:
          type: string
          enum: [cliente, vencido, agencia]
        cita:
          $ref: '#/components/schemas/CitaDePedido'
        renglones:
          type: array
          items:
            $ref: '#/components/schemas/RenglonPedido'
        pagable:
          type: boolean
          description: |
            V2-M14.04: Se puede pagar en la app: está `apartado` o `listo`, no ha vencido, tiene
            total y no está pagado.
        pago:
          allOf:
            - $ref: '#/components/schemas/Pago'
          nullable: true
          description: V2-M14.04. El pago con que quedó pagado. No viene si no está pagado.
        pagadoEn:
          type: string
          format: date-time
          nullable: true
          description: V2-M14.04. Cuándo quedó pagado en la app. Ya no vence ni se cancela desde la app.

    CitaDePedido:
